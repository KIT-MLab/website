<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レッスン画面ピッカー — 3案の見比べ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
 * レッスン画面ピッカー
 * 同じ1つの節（01-python/01-print）を3つの見た目で出し、
 * 下部に「例 / 例題 / 練習問題 / 演習問題」の見分けだけを並べる。
 *
 * ・マストヘッドとナビはサイト共通（tokens.css の第1次決定のまま）
 * ・本文の中は案ごとに別に組む（10-lesson-and-writing.md 第10.4節）
 * ・本文16px以上、コード14px以上（第9.4節 原則7）
 * ============================================================ */

/* ---------- ツールの枠（案の一部ではない） ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0f0f11;font-family:"Noto Sans JP",sans-serif}
#tool{position:sticky;top:0;z-index:60;background:#1c1c1e;color:#e8e8e8;border-bottom:1px solid #34343a;
  padding:9px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#tool .t-name{font-size:13px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
#tool .t-tabs{display:flex;gap:6px}
#tool button{font-family:inherit;font-size:13px;padding:5px 14px;border-radius:5px;border:1px solid #46464e;
  background:#2a2a2c;color:#ddd;cursor:pointer}
#tool button:hover{border-color:#8f8f98}
#tool button[aria-pressed="true"]{background:#ececec;color:#111;border-color:#ececec;font-weight:700}
#tool .t-desc{font-size:12px;color:#9c9ca4;flex:1;min-width:260px;line-height:1.6}
#tool .t-jump{font-size:12px;color:#9c9ca4;text-decoration:underline;white-space:nowrap}

/* ---------- サイト共通のマストヘッド（tokens.css の値をそのまま） ---------- */
.site{background:#f2f1ee;color:#232323;font-family:"BIZ UDPGothic","Noto Sans JP",sans-serif;
  border-bottom:3px double #3a3a3a;padding-top:16.5px}
.site__wrap{max-width:960px;margin:0 auto;padding:0 24px}
.site__name{display:block;text-align:center;text-decoration:none;color:inherit;font-family:"Zen Old Mincho",serif;
  font-weight:700;font-size:24px;letter-spacing:.08em;line-height:1.4}
.site__full{margin:4.5px 0 0;text-align:center;font-size:11.5px;letter-spacing:.14em;color:#5a5650}
.site__links{display:flex;justify-content:center;flex-wrap:wrap;gap:19.5px;margin-top:10.5px;
  border-top:1px solid #3a3a3a;padding:7.5px 0}
.site__links a{text-decoration:none;color:inherit;font-size:13.6px;white-space:nowrap;padding-bottom:2px}
.site__links a[aria-current="page"]{border-bottom:4px solid #b3402a;font-weight:700}

/* ---------- レッスン領域の骨格（3案共通の寸法） ---------- */
.lesson{padding:48px 0 78px}
.lesson__wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.lgrid{display:grid;grid-template-columns:minmax(0,720px) 240px;gap:48px;align-items:start}
.lbody{max-width:720px;min-width:0}
/* 実物と同じく右レールは追従する。ツールの帯（57px）の下に止める */
.lesson .rail{position:sticky;top:70px}
.cmp__pane .rail{position:static}
.lbody p{margin:0 0 1.1em}
.blk{margin:1.9em 0}
.blk__tab{margin:0}
.prompt p:last-child{margin-bottom:0}
.code pre,.out pre{margin:0;white-space:pre;overflow-x:auto;font-family:"IBM Plex Mono",monospace}
.ln{display:block}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font-family:inherit;cursor:pointer}
.rail ol,.rail ul{list-style:none;margin:0;padding:0}
.rail a{color:inherit}
.code--num pre{counter-reset:ln}
.code--num .ln{counter-increment:ln;padding-left:3.1em;position:relative}
.code--num .ln::before{content:counter(ln);position:absolute;left:0;width:2.1em;text-align:right;opacity:.42}

/* ============================================================
 * 案A ＝ 教科書
 * 明朝・罫線・番号。見分けの軸は「囲みの閉じ具合」。
 * 例=開いた縦罫 → 例題=上下の罫 → 練習=閉じた枠 → 演習=二重の太枠＋全幅の帯
 * ============================================================ */
.v-a{--paper:#f6f2e9;--card:#fffdf7;--ink:#1f1c17;--ink2:#5d564a;--rule:#c2b8a4;--strong:#2b261e;--accent:#9c3b21;
  background:var(--paper);color:var(--ink);font-family:"Noto Serif JP",serif;font-size:17.5px;line-height:2.05}
.v-a code{font-family:"IBM Plex Mono",monospace;font-size:15px;background:#ece5d5;padding:0 4px}
.v-a .ltop{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:34px}
.v-a .ltop__ch{margin:0;font-family:"Zen Old Mincho",serif;font-size:14.5px;letter-spacing:.18em;color:var(--ink2)}
.v-a .ltop__h1{margin:12px 0 0;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:31px;line-height:1.55;letter-spacing:.03em}
.v-a .ltop__h1 .sec{color:var(--accent);margin-right:16px}
.v-a .ltop__meta{margin:12px 0 0;font-size:14.5px;color:var(--ink2);letter-spacing:.06em}
.v-a .lbody>p{text-indent:1em}
.v-a .lbody>p.noind{text-indent:0}

.v-a .code{border:1px solid var(--rule);background:var(--card);margin-top:10px}
.v-a .code__lab{font-family:"Zen Old Mincho",serif;font-size:13px;letter-spacing:.14em;color:var(--ink2);
  padding:6px 14px;border-bottom:1px dotted var(--rule)}
.v-a .code pre{font-size:15px;line-height:1.85;padding:13px 16px}
.v-a .out{margin-top:12px}
.v-a .out__lab{font-family:"Zen Old Mincho",serif;font-size:13px;letter-spacing:.14em;color:var(--ink2);margin-bottom:4px}
.v-a .out pre{font-size:15px;line-height:1.85;padding:11px 16px;border:1px solid var(--rule);border-left:4px solid var(--strong);background:#f1ece0}
.v-a .stdin{margin-top:12px}
.v-a .stdin__lab{font-family:"Zen Old Mincho",serif;font-size:13px;letter-spacing:.14em;color:var(--ink2);display:block;margin-bottom:4px}
.v-a .stdin textarea{width:100%;font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:1.8;padding:8px 12px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);resize:vertical}
.v-a .stdin__note{margin:5px 0 0;font-size:13.5px;color:var(--ink2)}
.v-a .btn{font-family:"Zen Old Mincho",serif;font-size:15px;letter-spacing:.08em;padding:5px 16px;border:1px solid var(--strong);
  background:var(--card);color:var(--ink);border-radius:0}
.v-a .btn--strong{background:var(--strong);color:var(--card);font-weight:700}
.v-a .btn--quiet{border-style:dotted;color:var(--ink2)}
.v-a .bar{margin:14px 0 0}
.v-a .bar--top{margin:0 0 10px}

/* 4種類 ── 囲みが段階的に閉じていく */
.v-a .t-rei{padding-left:20px;border-left:2px solid var(--rule)}
.v-a .t-rei .blk__tab{font-family:"Zen Old Mincho",serif;font-size:15px;letter-spacing:.16em;color:var(--ink2);margin-bottom:8px}
.v-a .t-reidai{margin:2.3em 0;border-top:2px solid var(--strong);border-bottom:1px solid var(--strong);padding-bottom:20px}
.v-a .t-reidai .blk__tab{display:inline-block;background:var(--strong);color:var(--card);font-family:"Zen Old Mincho",serif;
  font-weight:700;font-size:15px;letter-spacing:.16em;padding:3px 18px;margin-bottom:16px}
.v-a .t-renshu{margin:2.6em 0;border:1px solid var(--strong);background:var(--card);padding:24px 22px 20px;position:relative}
.v-a .t-renshu .blk__tab{position:absolute;top:0;left:22px;transform:translateY(-50%);background:var(--strong);color:var(--card);
  font-family:"Zen Old Mincho",serif;font-weight:700;font-size:15px;letter-spacing:.16em;padding:3px 18px}
.v-a .t-enshu{margin:2.9em 0;border:3px double var(--strong);background:var(--card)}
.v-a .t-enshu .blk__tab{display:block;background:var(--accent);color:#fffdf7;font-family:"Zen Old Mincho",serif;font-weight:700;
  font-size:17px;letter-spacing:.24em;padding:9px 22px}
.v-a .t-enshu .blk__in{padding:24px 24px 26px}
.v-a .judge{margin:14px 0 0;font-size:15.5px;color:var(--ink2);border-top:1px dotted var(--rule);padding-top:12px}

.v-a .mistake{margin:2.4em 0;border-top:1px solid var(--rule);padding-top:16px}
.v-a .mistake__lab{margin:0 0 12px;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:19px;
  border-bottom:3px double var(--accent);display:inline-block;padding-bottom:3px}
.v-a .mistake__fix{margin-top:14px;font-size:16.5px}
.v-a .mistake__fix p{margin:0}
.v-a .lv0{margin:2em 0;border:1px dashed var(--rule);background:#f1ece0}
.v-a .lv0__t{cursor:pointer;font-family:"Zen Old Mincho",serif;font-size:14.5px;letter-spacing:.1em;color:var(--ink2);padding:8px 16px}
.v-a .lv0__b{padding:0 16px 12px;font-size:16.5px}
.v-a .lv0__b p{margin:0}
.v-a .lnav{display:flex;justify-content:space-between;gap:16px;margin-top:46px;border-top:1px solid var(--rule);padding-top:20px}
.v-a .lnav a{font-family:"Zen Old Mincho",serif;font-size:16px;color:inherit;text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:3px}
.v-a .rail{font-size:14px;line-height:1.8;color:var(--ink)}
.v-a .rail__lab{margin:0 0 10px;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:14.5px;letter-spacing:.14em;
  border-bottom:1px solid var(--rule);padding-bottom:5px}
.v-a .rail__blk+.rail__blk{margin-top:30px}
.v-a .rail li{display:flex;gap:9px;margin-bottom:10px;align-items:baseline}
.v-a .rail__st{flex:0 0 auto;width:2.6em;text-align:center;font-family:"Zen Old Mincho",serif;font-size:12px;color:var(--ink2)}
.v-a .rail li.is-now .rail__st{color:var(--accent);font-weight:700}
.v-a .rail li.is-now a{font-weight:700}
.v-a .rail a{text-decoration:none}
.v-a .rail__ask{width:100%;border:1px dotted var(--rule);background:transparent;color:var(--ink2);padding:6px 10px;font-family:"Zen Old Mincho",serif;font-size:14px}
.v-a .rail__note{margin:6px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.7}

/* ============================================================
 * 案B ＝ 実務の文書
 * サンセリフ・詰まった行間・コードが主役（暗い面）。
 * 見分けの軸は「左の帯の太さと見出し行の質」。角は常に0。
 * ============================================================ */
.v-b{--paper:#ffffff;--sub:#f1f4f6;--ink:#15181c;--ink2:#5b636c;--line:#d2d7dc;--strong:#1b2026;
  --c-rei:#9aa3ac;--c-reidai:#2b4a6f;--c-renshu:#2f6146;--c-enshu:#b3402a;--c-miss:#8a6a1f;
  background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",sans-serif;font-size:16.5px;line-height:1.78}
.v-b code{font-family:"IBM Plex Mono",monospace;font-size:15px;background:var(--sub);border:1px solid var(--line);padding:0 4px}
.v-b .ltop{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
  border-bottom:2px solid var(--strong);padding-bottom:12px;margin-bottom:28px}
.v-b .ltop__ch{margin:0;width:100%;font-size:12.5px;letter-spacing:.14em;color:var(--ink2)}
.v-b .ltop__h1{margin:6px 0 0;font-size:26px;font-weight:700;line-height:1.4;letter-spacing:.01em}
.v-b .ltop__h1 .sec{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:20px;color:var(--ink2);margin-right:12px}
.v-b .ltop__meta{margin:0;font-size:13px;color:var(--ink2);text-align:right;min-width:170px}
.v-b .prog{display:block;width:170px;height:3px;background:var(--sub);margin-top:7px}
.v-b .prog i{display:block;height:100%;width:50%;background:var(--strong)}

.v-b .code{margin-top:10px;background:#1b2026}
.v-b .code__lab{font-size:12px;letter-spacing:.12em;color:#95a0aa;background:#12171b;padding:6px 14px}
.v-b .code pre{font-size:14.5px;line-height:1.75;padding:13px 14px;color:#e6ebef}
.v-b .code--edit{border:1px solid var(--strong)}
.v-b .code--edit pre{min-height:5.6em}
.v-b .code--broken .code__lab{color:#e0b88a}
.v-b .out{margin-top:0;background:#0e1215}
.v-b .out__lab{font-size:12px;letter-spacing:.12em;color:#95a0aa;padding:6px 14px;border-top:1px solid #2a3138}
.v-b .out pre{font-size:14.5px;line-height:1.75;padding:2px 14px 13px;color:#dbe3e9}
.v-b .stdin{margin-top:12px}
.v-b .stdin__lab{display:block;font-size:12.5px;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px}
.v-b .stdin textarea{width:100%;font-family:"IBM Plex Mono",monospace;font-size:14.5px;line-height:1.7;padding:7px 11px;
  border:1px solid var(--line);background:var(--sub);color:var(--ink);border-radius:0;resize:vertical}
.v-b .stdin__note{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}
.v-b .btn{font-size:14px;padding:6px 16px;border:1px solid var(--strong);background:#fff;color:var(--ink);border-radius:0}
.v-b .btn--strong{background:var(--c-enshu);border-color:var(--c-enshu);color:#fff;font-weight:700}
.v-b .btn--quiet{border-color:var(--line);color:var(--ink2)}
.v-b .bar{margin:12px 0 0}
.v-b .bar--top{margin:0 0 8px}

/* 4種類 ── 左の帯が太くなり、見出し行が現れて塗りつぶされていく */
.v-b .t-rei{border-left:3px solid var(--c-rei);padding:0 0 0 16px;margin:1.7em 0}
.v-b .t-rei .blk__tab{font-size:12.5px;letter-spacing:.16em;color:var(--ink2);margin-bottom:6px}
.v-b .t-reidai{border-left:6px solid var(--c-reidai);background:var(--sub);padding:16px 20px 18px;margin:2em 0}
.v-b .t-reidai .blk__tab{display:inline-block;background:var(--c-reidai);color:#fff;font-size:12.5px;font-weight:500;
  letter-spacing:.16em;padding:3px 13px;margin-bottom:12px}
.v-b .t-renshu{border:1px solid var(--line);border-left:6px solid var(--c-renshu);background:#fff;margin:2.2em 0}
.v-b .t-renshu .blk__tab{display:block;background:var(--sub);border-bottom:1px solid var(--line);color:var(--c-renshu);
  font-size:13px;font-weight:700;letter-spacing:.16em;padding:9px 20px}
.v-b .t-renshu .blk__in{padding:16px 20px 18px}
.v-b .t-enshu{border:1.5px solid var(--strong);border-left:12px solid var(--c-enshu);background:#fff;margin:2.4em 0}
.v-b .t-enshu .blk__tab{display:block;background:var(--c-enshu);color:#fff;font-size:14.5px;font-weight:700;
  letter-spacing:.2em;padding:11px 20px}
.v-b .t-enshu .blk__in{padding:22px 20px 24px}
.v-b .judge{margin:14px 0 0;font-size:14.5px;color:var(--ink2);background:var(--sub);border-left:3px solid var(--line);padding:8px 12px}
.v-b .judge code{background:#fff}

.v-b .mistake{margin:2.2em 0;border:1px solid #e3d8bd;background:#fbf8f0}
.v-b .mistake__lab{margin:0;background:#f3ecdb;border-bottom:1px solid #e3d8bd;color:var(--c-miss);font-size:13px;
  font-weight:700;letter-spacing:.16em;padding:9px 20px}
.v-b .mistake__in{padding:16px 20px 18px}
.v-b .mistake__fix{margin-top:12px;font-size:16px}
.v-b .mistake__fix p{margin:0}
.v-b .lv0{margin:1.8em 0;border:1px dashed var(--line);background:var(--sub)}
.v-b .lv0__t{cursor:pointer;font-size:13px;letter-spacing:.1em;color:var(--ink2);padding:8px 16px}
.v-b .lv0__b{padding:0 16px 12px;font-size:16px}
.v-b .lv0__b p{margin:0}
.v-b .lnav{display:flex;justify-content:space-between;gap:12px;margin-top:42px;border-top:1px solid var(--line);padding-top:18px}
.v-b .lnav a{font-size:14.5px;color:inherit;text-decoration:none;border:1px solid var(--line);padding:8px 16px;background:var(--sub)}
.v-b .rail{font-size:14px;line-height:1.7;color:var(--ink)}
.v-b .rail__lab{margin:0 0 10px;font-size:12px;letter-spacing:.16em;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:6px}
.v-b .rail__blk+.rail__blk{margin-top:26px}
.v-b .rail li{display:flex;gap:9px;margin-bottom:9px;align-items:baseline}
.v-b .rail__st{flex:0 0 auto;width:2.4em;text-align:center;font-size:11px;border:1px solid var(--line);color:var(--ink2);line-height:1.8}
.v-b .rail li.is-now .rail__st{background:var(--strong);border-color:var(--strong);color:#fff}
.v-b .rail a{text-decoration:none}
.v-b .rail li.is-now a{font-weight:700}
.v-b .rail__ask{width:100%;border:1px solid var(--line);background:var(--sub);color:var(--ink2);padding:7px 10px;font-size:13.5px;border-radius:0}
.v-b .rail__note{margin:6px 0 0;font-size:12px;color:var(--ink2);line-height:1.65}

/* ============================================================
 * 案C ＝ ノート
 * 方眼の地・つまみ（タブ）・ベタ影。見分けの軸は「面の持ち上がり」。
 * 例=地に直接 → 例題=白い面 → 練習=面＋つまみ＋影 → 演習=太枠＋全幅の帯＋厚い影
 * ============================================================ */
.v-c{--paper:#f3f0e7;--card:#ffffff;--ink:#221f19;--ink2:#5f594e;--line:#2a2620;--soft:#c8c0ae;
  --ai:#26506e;--shu:#b3402a;
  background-color:var(--paper);
  background-image:linear-gradient(rgba(42,38,32,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(42,38,32,.06) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);font-family:"BIZ UDPGothic","Noto Sans JP",sans-serif;font-size:17px;line-height:1.95}
.v-c code{font-family:"IBM Plex Mono",monospace;font-size:15px;background:var(--card);border:1px solid var(--soft);padding:0 4px;border-radius:3px}
.v-c .ltop{margin-bottom:32px}
.v-c .ltop__ch{margin:0;font-size:13.5px;letter-spacing:.12em;color:var(--ink2)}
.v-c .ltop__ch::before{content:"";display:inline-block;width:9px;height:9px;background:var(--shu);margin-right:9px}
.v-c .ltop__h1{margin:10px 0 0;font-size:28px;font-weight:700;line-height:1.5;display:inline-block;
  border-bottom:5px solid var(--shu);padding-bottom:3px}
.v-c .ltop__h1 .sec{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--ink2);margin-right:12px}
.v-c .ltop__meta{margin:14px 0 0;font-size:14px;color:var(--ink2);border-top:2px dashed var(--soft);padding-top:10px}

.v-c .code{margin-top:10px;background:var(--card);border:1.5px solid var(--line);border-radius:4px;overflow:hidden}
.v-c .code__lab{font-size:12.5px;letter-spacing:.12em;color:var(--ink2);padding:6px 14px;border-bottom:1.5px dashed var(--soft)}
.v-c .code pre{font-size:15px;line-height:1.8;padding:12px 14px}
.v-c .code--num .ln::before{color:var(--ink2);opacity:1;border-right:1px dashed var(--soft);padding-right:9px;width:2.6em}
.v-c .code--num .ln{padding-left:3.8em}
.v-c .code--edit pre{min-height:5.4em}
.v-c .out{margin-top:12px;background:var(--card);border:1.5px solid var(--line);border-radius:4px}
.v-c .out__lab{display:inline-block;font-size:12.5px;letter-spacing:.12em;color:var(--card);background:var(--line);padding:3px 12px;border-radius:0 0 4px 0}
.v-c .out pre{font-size:15px;line-height:1.8;padding:8px 14px 13px}
.v-c .stdin{margin-top:12px}
.v-c .stdin__lab{display:block;font-size:12.5px;letter-spacing:.12em;color:var(--ink2);margin-bottom:4px}
.v-c .stdin textarea{width:100%;font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:1.75;padding:7px 11px;
  border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);resize:vertical}
.v-c .stdin__note{margin:5px 0 0;font-size:13px;color:var(--ink2)}
.v-c .btn{font-size:15px;padding:5px 16px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);
  color:var(--ink);box-shadow:3px 3px 0 var(--line)}
.v-c .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.v-c .btn--strong{background:var(--shu);border-color:var(--line);color:#fff;font-weight:700}
.v-c .btn--quiet{box-shadow:none;border-style:dashed;font-size:14px}
.v-c .bar{margin:14px 0 0}
.v-c .bar--top{margin:0 0 10px}

/* 4種類 ── 面が地から持ち上がっていく */
.v-c .t-rei{border-left:2px dashed var(--soft);padding-left:18px;margin:1.8em 0}
.v-c .t-rei .blk__tab{font-size:13.5px;letter-spacing:.14em;color:var(--ink2);margin-bottom:8px}
.v-c .t-rei .blk__tab::before{content:"";display:inline-block;width:7px;height:7px;background:var(--shu);margin-right:8px;vertical-align:2px}
.v-c .t-reidai{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:18px 20px 20px;margin:2.1em 0}
.v-c .t-reidai .blk__tab{display:inline-block;border:1.5px solid var(--line);border-radius:4px;background:var(--paper);
  font-size:13.5px;font-weight:700;letter-spacing:.14em;padding:2px 13px;margin-bottom:14px}
.v-c .t-renshu{position:relative;background:var(--card);border:2px solid var(--line);border-radius:6px;
  box-shadow:3px 3px 0 var(--line);padding:24px 20px 20px;margin:2.8em 0}
.v-c .t-renshu .blk__tab{position:absolute;top:-15px;left:18px;background:var(--ai);color:#fff;border:2px solid var(--line);
  border-radius:5px 5px 0 0;font-size:13.5px;font-weight:700;letter-spacing:.14em;padding:2px 14px}
.v-c .t-enshu{background:var(--card);border:2.5px solid var(--line);border-radius:6px;box-shadow:6px 6px 0 var(--line);margin:3em 0}
.v-c .t-enshu .blk__tab{display:block;background:var(--shu);color:#fff;border-bottom:2.5px solid var(--line);
  font-size:16px;font-weight:700;letter-spacing:.2em;padding:10px 20px;border-radius:3px 3px 0 0}
.v-c .t-enshu .blk__in{padding:22px 20px 24px}
.v-c .judge{margin:14px 0 0;font-size:15px;color:var(--ink2);border:1.5px dashed var(--soft);border-radius:4px;padding:9px 13px}

.v-c .mistake{margin:2.4em 0;background:var(--card);border:2px dashed var(--shu);border-radius:6px;padding:18px 20px 20px}
.v-c .mistake__lab{margin:0 0 12px;color:var(--shu);font-weight:700;font-size:15.5px;letter-spacing:.14em}
.v-c .mistake__fix{margin-top:12px;font-size:16.5px}
.v-c .mistake__fix p{margin:0}
.v-c .lv0{margin:2em 0;background:var(--card);border:1.5px solid var(--soft);border-radius:6px}
.v-c .lv0__t{cursor:pointer;font-size:13.5px;letter-spacing:.1em;color:var(--ink2);padding:8px 16px}
.v-c .lv0__b{padding:0 16px 12px;font-size:16.5px}
.v-c .lv0__b p{margin:0}
.v-c .lnav{display:flex;justify-content:space-between;gap:16px;margin-top:46px;border-top:2px dashed var(--soft);padding-top:22px}
.v-c .lnav a{font-size:15px;color:inherit;text-decoration:none;border:1.5px solid var(--line);border-radius:6px;
  box-shadow:3px 3px 0 var(--line);background:var(--card);padding:8px 16px}
.v-c .rail{font-size:14px;line-height:1.75;color:var(--ink)}
.v-c .rail__blk{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:14px 14px 14px}
.v-c .rail__blk+.rail__blk{margin-top:16px}
.v-c .rail__lab{margin:-24px 0 12px;display:block;width:fit-content;background:var(--line);color:var(--card);font-size:12.5px;
  letter-spacing:.14em;padding:2px 12px;border-radius:4px}
.v-c .rail li{display:flex;gap:9px;margin-bottom:9px;align-items:baseline}
.v-c .rail__st{flex:0 0 auto;width:2.5em;text-align:center;font-size:11.5px;border:1.5px solid var(--line);
  border-radius:3px;color:var(--ink2);background:var(--paper);line-height:1.75}
.v-c .rail li.is-now .rail__st{background:var(--shu);border-color:var(--shu);color:#fff}
.v-c .rail a{text-decoration:none}
.v-c .rail li.is-now a{font-weight:700}
.v-c .rail__ask{width:100%;border:1.5px dashed var(--soft);border-radius:6px;background:var(--paper);color:var(--ink2);
  padding:7px 10px;font-size:14px}
.v-c .rail__note{margin:6px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.7}

/* ============================================================
 * 下部: 4種類の見分けだけを比べる欄
 * ============================================================ */
#compare{background:#17171a;color:#e6e6ea;padding:44px 0 64px;border-top:3px solid #000}
#compare .cwrap{max-width:1200px;margin:0 auto;padding:0 24px}
#compare h2{margin:0;font-size:19px;letter-spacing:.06em}
#compare .cnote{margin:8px 0 26px;font-size:13px;color:#9c9ca4;line-height:1.8;max-width:760px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.cmp__head{margin:0 0 4px;font-size:14px;font-weight:700;letter-spacing:.06em}
.cmp__axis{margin:0 0 10px;font-size:12px;color:#9c9ca4;line-height:1.7}
.cmp__pane{padding:22px 18px 24px}
.cmp__pane .blk{margin:0 0 26px}
.cmp__pane .blk:last-child{margin-bottom:0}
.cmp__pane .blk__in p{margin:0;font-size:15px;line-height:1.75}
.cmp__pane .blk__in pre{margin:0;font-family:"IBM Plex Mono",monospace;font-size:14px}
.v-c.cmp__pane .t-renshu{margin-top:16px}
.v-a.cmp__pane .t-renshu,.v-a.cmp__pane .t-reidai{margin-top:0}
</style>
</head>
<body>

<header id="tool">
  <span class="t-name">レッスン画面ピッカー</span>
  <span class="t-tabs">
    <button type="button" data-v="a" aria-pressed="true">案A 教科書</button>
    <button type="button" data-v="b" aria-pressed="false">案B 実務の文書</button>
    <button type="button" data-v="c" aria-pressed="false">案C ノート</button>
  </span>
  <span class="t-desc" id="tdesc"></span>
  <a class="t-jump" href="#compare">4種類の見分けだけを比べる ↓</a>
</header>

<div id="stage"></div>

<section id="compare">
  <div class="cwrap">
    <h2>4種類の見分けだけを比べる</h2>
    <p class="cnote">全体を見ずに、例 / 例題 / 練習問題 / 演習問題 の付き方だけを比べる欄です。上から下へ「軽い→重い」の順に並べています。文字を読まずに順序が分かるか、色を無視しても順序が分かるかを見てください。</p>
    <div class="cmp" id="cmp"></div>
  </div>
</section>

<script>
/* ------------------------------------------------------------
 * 中身は src/content/lessons/01-python/01-print.mdx のまま。
 * 3案で同じ文章・同じコード・同じ問題を出し、見た目だけを変える。
 * ---------------------------------------------------------- */
var esc = function (s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
};
var lines = function (arr) {
  return arr.map(function (l) { return '<span class="ln">' + (l === '' ? '&nbsp;' : esc(l)) + '</span>'; }).join('');
};
var code = function (label, arr, mod) {
  return '<div class="code code--num' + (mod ? ' ' + mod : '') + '">' +
    '<div class="code__lab">' + label + '</div><pre>' + lines(arr) + '</pre></div>';
};
var out = function (label, arr) {
  return '<div class="out"><div class="out__lab">' + label + '</div><pre>' + lines(arr) + '</pre></div>';
};
var stdin = function (val) {
  return '<div class="stdin"><label class="stdin__lab">入力</label>' +
    '<textarea rows="2" spellcheck="false">' + esc(val) + '</textarea>' +
    '<p class="stdin__note">input() は、この欄を上から1行ずつ読みます。</p></div>';
};
var btn = function (t, mod) {
  return '<button type="button" class="btn' + (mod ? ' btn--' + mod : '') + '">' + t + '</button>';
};
var blk = function (type, kind, num, inner) {
  return '<section class="blk t-' + type + '">' +
    '<p class="blk__tab">' + kind + ' ' + num + '</p>' +
    '<div class="blk__in">' + inner + '</div></section>';
};

/* ---- 4種類の中身（すべて 01-print.mdx の実物） ---- */
var REI = blk('rei', '例', '1',
  '<div class="bar bar--top">' + btn('▶ 実行') + '</div>' +
  code('コード例', ['print("Hello")', 'print(10 + 20)']) +
  out('実行結果', ['Hello', '30']));

var REIDAI = blk('reidai', '例題', '1',
  '<div class="prompt"><p>次のコードを入力して実行し、採点してください。</p></div>' +
  code('打つコード', ['print("Python")'], 'code--quote') +
  code('コード', ['', '', '', ''], 'code--edit') +
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + '</div>');

var RENSHU = blk('renshu', '練習問題', '1',
  '<div class="prompt"><p>上のコードを書き足して、1行目に <code>赤</code>、2行目に <code>青</code> と表示されるようにしてください。</p></div>' +
  code('コード', ['print("赤")', '', ''], 'code--edit') +
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + btn('最初の形に戻す', 'quiet') + '</div>');

var ENSHU = blk('enshu', '演習問題', '1',
  '<div class="prompt"><p>入力欄の1行を読み取り、その前後に <code>【</code> と <code>】</code> を付けて表示するプログラムを書いてください。入力欄の1行を読むには <code>input()</code> と書きます。<code>input()</code> の説明は次の節で行います。</p></div>' +
  '<p class="judge">判定に使う入力: <code>りんご</code>　<code>0</code>　<code>-5</code></p>' +
  code('解答のコード', ['', '', '', '', ''], 'code--edit') +
  stdin('りんご') +
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + '</div>');

var MISTAKE =
  '<aside class="mistake"><p class="mistake__lab">よくある間違い</p><div class="mistake__in">' +
  '<div class="bar bar--top">' + btn('▶ 実行') + '</div>' +
  code('壊れたコードの例', ['print(“Python”)'], 'code--broken') +
  out('出るエラー', ["SyntaxError: invalid character '“' (U+201C)"]) +
  '<div class="mistake__fix"><p>全角のダブルクォートを使っています。<code>"</code> は半角で入力してください。日本語入力がオンになっていると全角になります。</p></div>' +
  '</div></aside>';

var LEVEL0 =
  '<details class="lv0" open><summary class="lv0__t">操作の補足: 半角のダブルクォートの入れ方</summary>' +
  '<div class="lv0__b"><p><code>Shift</code> を押しながら数字の <code>2</code> のキーを押すと <code>"</code> が入ります。' +
  '日本語入力がオンのときは <code>”</code> になります。<code>半角/全角</code> キーで日本語入力を切り替えてください。</p></div></details>';

var RAIL =
  '<aside class="rail">' +
  '<div class="rail__blk"><p class="rail__lab">この章の節</p><ol>' +
  '<li class="is-now"><span class="rail__st">いま</span><a href="#">printで値を表示する</a></li>' +
  '<li><span class="rail__st">未</span><a href="#">inputで値を受け取る</a></li>' +
  '</ol></div>' +
  '<div class="rail__blk"><p class="rail__lab">用語集</p><a href="#">この教材で使う言葉</a></div>' +
  '<div class="rail__blk"><p class="rail__lab">先生に聞く</p>' +
  '<button type="button" class="rail__ask" disabled>準備中</button>' +
  '<p class="rail__note">ログインを作ったら使えるようになります。</p></div>' +
  '</aside>';

var SITE =
  '<header class="site"><div class="site__wrap">' +
  '<a class="site__name" href="#">KIT 機械学習プロジェクト</a>' +
  '<p class="site__full">AI・機械学習を全課程で0から学べるプロジェクト</p>' +
  '<nav class="site__links">' +
  '<a href="#">ホーム</a><a href="#">プロジェクトについて</a><a href="#">活動</a>' +
  '<a href="#" aria-current="page">学習</a><a href="#">成果・お知らせ</a>' +
  '</nav></div></header>';

function lessonHTML(v) {
  return '<section class="lesson v-' + v + '"><div class="lesson__wrap">' +
    '<div class="ltop">' +
      '<p class="ltop__ch">第1章 Python を書きはじめる</p>' +
      '<h1 class="ltop__h1"><span class="sec">1.1</span>printで値を表示する</h1>' +
      '<p class="ltop__meta">この章の 1 / 2 節 ・ 目安 12 分' +
        (v === 'b' ? '<span class="prog"><i></i></span>' : '') + '</p>' +
    '</div>' +
    '<div class="lgrid"><article class="lbody">' +

      '<p>10と20を足す式を書いても、画面には何も出ません。計算の結果を画面に出す手立てがないと、合っているかを目で確かめられません。数が合わないときに、どこで違ったのかも分かりません。</p>' +

      '<p class="noind">次のコードの ▶ を押してください。</p>' +
      REI +

      '<p>1行目の <code>print</code> は、渡した値を画面に表示する関数です。かっこの中に書いた値を引数（ひきすう）と呼びます。1行目の引数は <code>"Hello"</code> です。</p>' +
      '<p><code>"</code> で囲んだものを文字列（string）と呼びます。囲みの <code>"</code> は画面に出ません。出るのは中の文字だけです。</p>' +
      '<p>2行目の引数は <code>10 + 20</code> です。かっこの中が先に計算され、結果の <code>30</code> が表示されます。<code>print</code> は1回呼ぶごとに1行を表示します。</p>' +
      '<p><code>print</code> を書かずに <code>10 + 20</code> とだけ書いた場合、計算は行われますが画面には何も出ません。表示するかどうかは、書いた人が <code>print</code> で指示します。</p>' +

      LEVEL0 +
      MISTAKE +
      REIDAI +
      RENSHU +
      ENSHU +

      '<p><code>print</code> で値を出せるようになりました。次の節では、こちらから値を渡す <code>input()</code> を扱います。</p>' +

      '<nav class="lnav"><span></span><a href="#">次の節へ　inputで値を受け取る →</a></nav>' +
    '</article>' + RAIL + '</div></div></section>';
}

var DESC = {
  a: '案A 教科書 — 明朝・広い余白・罫線と番号。見分けの軸は「囲みの閉じ具合」。開いた縦罫 → 上下の罫 → 閉じた枠 → 二重の太枠＋全幅の帯。',
  b: '案B 実務の文書 — サンセリフ・詰まった行間・コードが主役（暗い面）。見分けの軸は「左の帯の太さと見出し行の質」。角は常に0。',
  c: '案C ノート — 方眼の地・つまみ（タブ）・ベタ影。見分けの軸は「面の持ち上がり」。地に直接 → 白い面 → 面＋つまみ＋影 → 太枠＋帯＋厚い影。'
};

var stage = document.getElementById('stage');
stage.innerHTML = ['a', 'b', 'c'].map(function (v) {
  return '<div class="pane" id="pane-' + v + '"' + (v === 'a' ? '' : ' hidden') + '>' + SITE + lessonHTML(v) + '</div>';
}).join('');

var tabs = document.querySelectorAll('#tool button[data-v]');
var desc = document.getElementById('tdesc');
function show(v) {
  ['a', 'b', 'c'].forEach(function (k) { document.getElementById('pane-' + k).hidden = k !== v; });
  tabs.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
  desc.textContent = DESC[v];
  window.scrollTo(0, 0);
}
tabs.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.v); }); });
desc.textContent = DESC.a;

/* ---- 下部: 4種類の見分けだけ ---- */
var SHORT = [
  ['rei', '例', '1', '<pre>print("Hello")</pre>'],
  ['reidai', '例題', '1', '<p>次のコードを入力して実行し、採点してください。</p>'],
  ['renshu', '練習問題', '1', '<p>上のコードを書き足して、1行目に 赤、2行目に 青 と…</p>'],
  ['enshu', '演習問題', '1', '<p>入力欄の1行を読み取り、その前後に 【 と 】 を付けて…</p>']
];
var COLS = [
  ['a', '案A 教科書', '見分けの軸: 囲みの閉じ具合。色はほぼ使わず、罫が閉じていくことで重さを出す。'],
  ['b', '案B 実務の文書', '見分けの軸: 左の帯の太さと見出し行の質。帯が太くなり、見出し行が現れて塗りつぶされる。'],
  ['c', '案C ノート', '見分けの軸: 面の持ち上がり。地に直接 → 白い面 → つまみ付き＋影 → 太枠＋全幅の帯＋厚い影。']
];
document.getElementById('cmp').innerHTML = COLS.map(function (c) {
  return '<div class="cmp__col"><p class="cmp__head">' + c[1] + '</p><p class="cmp__axis">' + c[2] + '</p>' +
    '<div class="lesson v-' + c[0] + ' cmp__pane">' +
    SHORT.map(function (s) { return blk(s[0], s[1], s[2], s[3]); }).join('') +
    '</div></div>';
}).join('');
</script>
</body>
</html>
