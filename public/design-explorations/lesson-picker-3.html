<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レッスン画面ピッカー 第3回 — 案G / 案H / 案I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
 * レッスン画面ピッカー 第3回
 *
 * 第2回への回答:
 *   「D・E・F はどれも違う。案Cのように、枠のタイトルが
 *     角を落とした色地に白文字で書かれているのが良い。
 *     素地の文字だけだと、どれがタイトルか分かりづらい」
 *   → design/spec/10-lesson-and-writing.md 第10.5節に規則化
 *
 * 3案が共通して守ること
 *   1. 枠のタイトルはすべて「札」。色地＋白文字、角3〜5px。
 *      対象＝課題4種・よくある間違い・コードと実行結果のキャプション・
 *      右レールの各節・レベル0の補足。素地の文字にしない
 *   2. 案Aの雰囲気（明朝の見出し・罫線で構造・紙・余白）を土台にする → .vbase
 *   3. コードは黒い面（第2回で採用した温かい墨色 #17140f 系）
 *   4. 札は「どこが見出しか」、罫・地色の階段は「どれが重いか」。両方やる
 *      階段（3案共通・動かさない）:
 *        例=左の縦罫 → 例題=上下の罫 → 練習問題=閉じた枠＋白い面
 *        → 演習問題=二重の太枠＋白い面＋足元の帯
 *      よくある間違いは左右に枠を持たない段なので、この階段に混ざらない
 *
 * 3案で変えるのは「札の言語」だけ
 *   案G 小札     小さい角丸の札が枠の上辺に乗る／またぐ。色は種類ごと
 *   案H 全幅の帯 札を枠の幅いっぱいの帯にして頭に置く。高さでも重さを出す
 *   案I 墨で統一 札はほぼ墨。朱は演習問題とよくある間違いだけ。
 *                種類の区別は札の形・大きさ・位置で付ける
 *
 * ・マストヘッドとナビは第1次トークンのまま共通
 * ・本文17.5px（16px以上）、コード15px（14px以上）
 * ・本文720px＋右レール240px、外枠1080px（実装と同一）
 * ============================================================ */

/* ---------- ツールの枠（案の一部ではない） ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0f0f11;font-family:"Noto Sans JP",sans-serif}
#tool{position:sticky;top:0;z-index:60;background:#1c1c1e;color:#e8e8e8;border-bottom:1px solid #34343a;
  padding:9px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#tool .t-name{font-size:13px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
#tool .t-tabs{display:flex;gap:6px}
#tool button{font-family:inherit;font-size:13px;padding:5px 14px;border-radius:5px;border:1px solid #46464e;
  background:#2a2a2c;color:#ddd;cursor:pointer}
#tool button:hover{border-color:#8f8f98}
#tool button[aria-pressed="true"]{background:#ececec;color:#111;border-color:#ececec;font-weight:700}
#tool .t-desc{font-size:12px;color:#9c9ca4;flex:1;min-width:260px;line-height:1.6}
#tool .t-jump{font-size:12px;color:#9c9ca4;text-decoration:underline;white-space:nowrap}

/* ---------- サイト共通のマストヘッド（tokens.css の値をそのまま） ---------- */
.site{background:#f2f1ee;color:#232323;font-family:"BIZ UDPGothic","Noto Sans JP",sans-serif;
  border-bottom:3px double #3a3a3a;padding-top:16.5px}
.site__wrap{max-width:960px;margin:0 auto;padding:0 24px}
.site__name{display:block;text-align:center;text-decoration:none;color:inherit;font-family:"Zen Old Mincho",serif;
  font-weight:700;font-size:24px;letter-spacing:.08em;line-height:1.4}
.site__full{margin:4.5px 0 0;text-align:center;font-size:11.5px;letter-spacing:.14em;color:#5a5650}
.site__links{display:flex;justify-content:center;flex-wrap:wrap;gap:19.5px;margin-top:10.5px;
  border-top:1px solid #3a3a3a;padding:7.5px 0}
.site__links a{text-decoration:none;color:inherit;font-size:13.6px;white-space:nowrap;padding-bottom:2px}
.site__links a[aria-current="page"]{border-bottom:4px solid #b3402a;font-weight:700}

/* ---------- レッスン領域の骨格（3案共通の寸法） ---------- */
.lesson{padding:48px 0 78px}
.lesson__wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.lgrid{display:grid;grid-template-columns:minmax(0,720px) 240px;gap:48px;align-items:start}
.lbody{max-width:720px;min-width:0}
.lesson .rail{position:sticky;top:70px}
.cmp__pane .rail{position:static}
.lbody p{margin:0 0 1.1em}
.blk{margin:1.9em 0}
.blk__tab{margin:0}
.prompt p:last-child{margin-bottom:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font-family:inherit;cursor:pointer}
.rail ol,.rail ul{list-style:none;margin:0;padding:0}
.rail a{color:inherit}

/* ============================================================
 * 黒い面（3案共通の中身。札の当て方だけ案ごとに変える）
 * 純黒ではなく紙に寄せた温かい墨色。第2回から引き継ぐ。
 * ============================================================ */
:root{
  --k-bg:#17140f;      /* コードの面 */
  --k-bg2:#100e0a;     /* 実行結果の面（1段沈む） */
  --k-fg:#ece6d8;      /* コードの字 */
  --k-fg2:#d6cfbf;     /* 結果の字 */
  --k-err:#e9b39b;     /* エラーの字 */
  --k-gut:#6b6355;     /* 行番号 */
}
.code{background:var(--k-bg)}
.out{background:var(--k-bg2)}
.code pre,.out pre{margin:0;white-space:pre;overflow-x:auto;font-family:"IBM Plex Mono",monospace;
  font-size:15px;line-height:1.85;padding:13px 16px}
.code pre{color:var(--k-fg)}
.out pre{color:var(--k-fg2)}
.out--err pre{color:var(--k-err)}
.ln{display:block}
.code--num pre{counter-reset:ln}
.code--num .ln{counter-increment:ln;padding-left:3.1em;position:relative}
.code--num .ln::before{content:counter(ln);position:absolute;left:0;width:2.1em;text-align:right;color:var(--k-gut)}
/* 書き換えるエディタ（行番号の溝つき） */
.ed-wrap{display:flex;align-items:stretch;background:var(--k-bg)}
.ed-gut{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:1.85;
  color:var(--k-gut);text-align:right;padding:13px 9px 13px 16px;user-select:none}
.ed-gut span{display:block}
textarea.ed{flex:1;min-width:0;display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:1.85;
  padding:13px 16px 13px 7px;border:0;outline:0;resize:vertical;background:transparent;color:var(--k-fg)}
textarea.sin{display:block;width:100%;font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:1.85;
  padding:11px 16px;border:0;outline:0;resize:vertical;background:var(--k-bg2);color:var(--k-fg)}

/* ============================================================
 * .vbase ＝ 3案が共有する「案Aの雰囲気」
 * 明朝の見出し、罫線で作る構造、紙の落ち着き、余白。
 * 本文の書体と行間は案Aのまま動かさない。
 * ============================================================ */
.vbase{--paper:#f6f2e9;--card:#fffdf7;--ink:#1f1c17;--ink2:#5d564a;--rule:#c2b8a4;--strong:#2b261e;--shu:#9c3b21;
  /* 札の色 */
  --fu-rei:#6f6758;    /* 例 ＝ 灰 */
  --fu-reidai:#2b261e; /* 例題 ＝ 墨 */
  --fu-renshu:#27506c; /* 練習問題 ＝ 藍 */
  --fu-enshu:#9c3b21;  /* 演習問題 ＝ 朱 */
  --fu-miss:#8a6a1f;   /* よくある間違い ＝ 琥珀（4段の階段の色から外す） */
  --fu-code:#4c4336;   /* コードのキャプション（黒い面より明るい墨） */
  --fu-out:#3b342a;    /* 実行結果のキャプション（1段沈む） */
  --fu-err:#9c3b21;    /* 出るエラーのキャプション */
  --fu-rail:#2b261e;   /* 右レールの各節 */
  --fu-lv0:#7d7466;    /* レベル0の補足 */
  --wash:#f0e4dd;      /* 演習問題の足元の帯 */
  background:var(--paper);
  color:var(--ink);font-family:"Noto Serif JP",serif;font-size:17.5px;line-height:2.05}
.vbase code{font-family:"IBM Plex Mono",monospace;font-size:15px;background:#ece5d5;padding:0 4px}

/* 章と節の見出し・進度の行（本文の見出しなので札にしない。罫と書体で組む） */
.vbase .ltop{border-bottom:3px double var(--strong);padding-bottom:16px;margin-bottom:34px}
.vbase .ltop__ch{margin:0;font-family:"Zen Old Mincho",serif;font-size:14.5px;letter-spacing:.18em;color:var(--ink2)}
.vbase .ltop__h1{margin:12px 0 0;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:31px;
  line-height:1.55;letter-spacing:.03em}
.vbase .ltop__h1 .sec{color:var(--shu);margin-right:16px}
.vbase .ltop__meta{margin:12px 0 0;font-size:14.5px;color:var(--ink2);letter-spacing:.06em}
.vbase .lbody>p{text-indent:1em}
.vbase .lbody>p.noind{text-indent:0}

/* ---- 札の共通の素（色と形は案ごとに上書きする） ---- */
.vbase .blk__tab,.vbase .code__lab,.vbase .out__lab,.vbase .stdin__lab,
.vbase .rail__lab,.vbase .mistake__lab,.vbase .lv0__fu{
  font-family:"Zen Old Mincho",serif;font-weight:700;color:#fffdf7;letter-spacing:.16em;white-space:nowrap}
.vbase .code__lab,.vbase .out__lab,.vbase .stdin__lab{letter-spacing:.12em}

/* ---- 階段（3案共通。札とは別に「どれが重いか」を示す） ---- */
.vbase .t-rei{margin:2.1em 0}
.vbase .t-reidai{margin:2.6em 0}
.vbase .t-renshu{margin:3em 0}
.vbase .t-enshu{margin:3.4em 0}
.vbase .t-renshu,.vbase .t-enshu{background:var(--card)}
.vbase .t-renshu{border:1.5px solid var(--strong)}
.vbase .t-enshu{border:3px double var(--strong)}
.vbase .t-enshu .blk__foot{background:var(--wash);border-top:1px solid var(--strong);padding:14px 24px}
.vbase .t-enshu .blk__foot .bar{margin:0}

/* ---- そのほか ---- */
.vbase .judge{margin:14px 0 0;font-size:15.5px;color:var(--ink2);
  border-top:1px dotted var(--rule);border-bottom:1px dotted var(--rule);padding:8px 0}
.vbase .stdin__note{margin:6px 0 0;font-size:13.5px;color:var(--ink2);text-indent:0}
.vbase .mistake__fix{margin-top:14px;font-size:16.5px}
.vbase .mistake__fix p{margin:0}
.vbase .lv0{margin:2.6em 0;border:1px dashed var(--rule);background:#f1ece0}
.vbase .lv0__t{cursor:pointer;font-family:"Zen Old Mincho",serif;font-size:14.5px;letter-spacing:.1em;
  color:var(--ink2);padding:10px 16px}
.vbase .lv0__b{padding:0 16px 13px;font-size:16.5px}
.vbase .lv0__b p{margin:0}
.vbase .lnav{display:flex;justify-content:space-between;gap:16px;margin-top:46px;
  border-top:1px solid var(--rule);padding-top:20px}
.vbase .lnav a{font-family:"Zen Old Mincho",serif;font-size:16px;color:inherit;text-decoration:none;
  border-bottom:1px solid var(--rule);padding-bottom:3px}
.vbase .btn{font-family:"Zen Old Mincho",serif;font-size:15px;letter-spacing:.08em;padding:6px 18px;
  border-radius:4px;border:1px solid var(--strong);background:var(--card);color:var(--ink)}
.vbase .btn--strong{background:var(--strong);color:var(--card);font-weight:700}
.vbase .btn--quiet{border-style:dotted;color:var(--ink2)}
.vbase .bar{margin:14px 0 0}
.vbase .bar--top{margin:0 0 10px}
.vbase .rail{font-size:14px;line-height:1.8;color:var(--ink)}
.vbase .rail__blk{border:1.5px solid var(--strong);background:var(--card)}
.vbase .rail li{display:flex;gap:9px;margin-bottom:10px;align-items:baseline}
.vbase .rail li:last-child{margin-bottom:0}
.vbase .rail__st{flex:0 0 auto;width:2.6em;text-align:center;font-family:"Zen Old Mincho",serif;
  font-size:12px;color:var(--ink2)}
.vbase .rail li.is-now .rail__st{color:var(--shu);font-weight:700}
.vbase .rail li.is-now a{font-weight:700}
.vbase .rail a{text-decoration:none}
.vbase .rail__note{margin:6px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.7}
.vbase .rail__ask{width:100%;border:1px dotted var(--rule);background:var(--paper);color:var(--ink2);
  padding:7px 10px;font-family:"Zen Old Mincho",serif;font-size:14px;border-radius:4px}

/* ============================================================
 * 案G ＝ 小札（案Cの延長）
 *
 * 小さい角丸の札が、枠の上辺に半分だけ乗る（またぐ）。
 * 色は種類ごとに変える。例＝灰 / 例題＝墨 / 練習問題＝藍 / 演習問題＝朱。
 * 右レールもコードのキャプションも同じ小札。
 * 案Cに一番近いが、本文と地は案Aのまま（明朝・罫・紙）。
 * ============================================================ */
.v-g .blk,.v-g .mistake,.v-g .code,.v-g .out,.v-g .stdin,.v-g .rail__blk,.v-g .lv0{position:relative}
.v-g .blk__tab{position:absolute;top:0;transform:translateY(-50%);z-index:2;border-radius:4px}

/* 例 ── 枠を持たないので札は文中に置く */
.v-g .t-rei{padding-left:20px;border-left:2px solid var(--rule)}
.v-g .t-rei .blk__tab{position:static;transform:none;display:inline-block;background:var(--fu-rei);
  font-size:13px;padding:2px 13px;margin-bottom:10px}
/* 例題 ── 上下の罫。札が上の罫をまたぐ */
.v-g .t-reidai{border-top:2px solid var(--strong);border-bottom:1px solid var(--strong)}
.v-g .t-reidai .blk__tab{left:18px;background:var(--fu-reidai);font-size:14px;padding:3px 16px}
.v-g .t-reidai .blk__in{padding:26px 18px 20px}
/* 練習問題 ── 閉じた枠。札が上辺をまたぐ */
.v-g .t-renshu .blk__tab{left:20px;background:var(--fu-renshu);font-size:15px;padding:4px 18px;border-radius:5px}
.v-g .t-renshu .blk__in{padding:28px 22px 22px}
/* 演習問題 ── 二重の太枠。札はいちばん大きく、上辺をまたぐ */
.v-g .t-enshu .blk__tab{left:22px;background:var(--fu-enshu);font-size:17.5px;padding:6px 22px;
  border-radius:5px;letter-spacing:.2em}
.v-g .t-enshu .blk__in{padding:34px 24px 22px}
/* よくある間違い ── 左右に枠が無い段。札は上の二重罫の左端に乗る（琥珀） */
.v-g .mistake{margin:3em 0;border-top:3px double var(--fu-miss);border-bottom:3px double var(--fu-miss);
  padding:26px 0 20px}
.v-g .mistake__lab{position:absolute;left:0;top:0;transform:translateY(-50%);margin:0;
  background:var(--fu-miss);border-radius:4px;font-size:15px;padding:4px 18px}
/* コードと実行結果 ── 黒い面の上辺を小札がまたぐ */
.v-g .code,.v-g .stdin{margin-top:24px}
.v-g .out{margin-top:24px}
.v-g .code__lab,.v-g .out__lab,.v-g .stdin__lab{position:absolute;left:14px;top:0;transform:translateY(-50%);
  z-index:2;border-radius:4px;font-size:12.5px;padding:2px 12px}
.v-g .code__lab,.v-g .stdin__lab{background:var(--fu-code)}
.v-g .out__lab{background:var(--fu-out)}
.v-g .out--err .out__lab{background:var(--fu-err)}
/* 右レール ── 各節の札が枠の上辺をまたぐ */
.v-g .rail__blk{padding:0}
.v-g .rail__in{padding:24px 15px 15px}
.v-g .rail__lab{position:absolute;left:14px;top:0;transform:translateY(-50%);margin:0;background:var(--fu-rail);
  border-radius:4px;font-size:12.5px;padding:2px 12px;letter-spacing:.12em}
.v-g .rail__blk+.rail__blk{margin-top:28px}
/* レベル0の補足 */
.v-g .lv0__fu{display:inline-block;background:var(--fu-lv0);border-radius:4px;font-size:12.5px;
  padding:2px 11px;letter-spacing:.12em;margin-right:10px}

/* ============================================================
 * 案H ＝ 全幅の帯
 *
 * 札を枠の幅いっぱいの帯にして、ブロックの頭に置く。
 * 色は種類ごと。帯の高さでも重さの差を作る（例＝細い、演習問題＝厚い）。
 * 右レールの各節も、コードのキャプションも全幅の帯。
 * 雑誌の小見出しに近い、はっきりした見え方。
 * ============================================================ */
.v-h .blk__tab{display:block;border-radius:4px 4px 0 0}

/* 例 ── いちばん細い帯 */
.v-h .t-rei{border-left:2px solid var(--rule)}
.v-h .t-rei .blk__tab{background:var(--fu-rei);font-size:13px;padding:3px 20px}
.v-h .t-rei .blk__in{padding:12px 0 0 20px}
/* 例題 ── 一段厚い帯。下は1px罫で閉じる */
.v-h .t-reidai{border-top:2px solid var(--strong);border-bottom:1px solid var(--strong)}
.v-h .t-reidai .blk__tab{background:var(--fu-reidai);font-size:14.5px;padding:6px 20px}
.v-h .t-reidai .blk__in{padding:16px 20px 20px}
/* 練習問題 ── もう一段厚い帯。閉じた枠の頭に置く */
.v-h .t-renshu .blk__tab{background:var(--fu-renshu);font-size:15.5px;padding:9px 20px}
.v-h .t-renshu .blk__in{padding:18px 22px 22px}
/* 演習問題 ── いちばん厚い帯 */
.v-h .t-enshu .blk__tab{background:var(--fu-enshu);font-size:17.5px;padding:13px 22px;letter-spacing:.2em}
.v-h .t-enshu .blk__in{padding:22px 24px 22px}
/* よくある間違い ── 左右に枠が無い段。帯は全幅だが上の二重罫の下に付く（琥珀） */
.v-h .mistake{margin:3em 0;border-top:3px double var(--fu-miss);border-bottom:3px double var(--fu-miss)}
.v-h .mistake__lab{display:block;margin:0;background:var(--fu-miss);font-size:15px;padding:7px 20px}
.v-h .mistake__in{padding:18px 0 20px}
/* コードと実行結果 ── 黒い面の頭に全幅の帯 */
.v-h .code,.v-h .out,.v-h .stdin{border-radius:4px;overflow:hidden;margin-top:12px}
.v-h .code__lab,.v-h .out__lab,.v-h .stdin__lab{display:block;font-size:12.5px;padding:5px 16px}
.v-h .code__lab,.v-h .stdin__lab{background:var(--fu-code)}
.v-h .out__lab{background:var(--fu-out)}
.v-h .out--err .out__lab{background:var(--fu-err)}
/* 右レール ── 各節の頭に全幅の帯 */
.v-h .rail__blk{padding:0;border-radius:4px;overflow:hidden}
.v-h .rail__in{padding:14px 15px 15px}
.v-h .rail__lab{display:block;margin:0;background:var(--fu-rail);font-size:12.5px;padding:5px 14px;letter-spacing:.12em}
.v-h .rail__blk+.rail__blk{margin-top:20px}
/* レベル0の補足 ── 見出しの行そのものが帯になる */
.v-h .lv0{border-style:solid;border-color:var(--rule)}
.v-h .lv0__t{background:var(--fu-lv0);color:#fffdf7;padding:7px 16px}
.v-h .lv0__fu{border-right:1px solid rgba(255,253,247,.45);padding-right:11px;margin-right:11px;font-size:13px}
.v-h .lv0__b{padding:12px 16px 13px}

/* ============================================================
 * 案I ＝ 墨で統一、朱は一点
 *
 * 札の色はほぼ墨。朱は演習問題とよくある間違いにだけ使う。
 * 種類の区別は札の形と大きさで付ける。
 *   例      文中の小さい札（四隅とも丸い・いちばん小さい）
 *   例題    上の罫をまたぐ札（四隅とも丸い・一回り大きい）
 *   練習問題 枠の上辺に立つ札（下の角は落とさない＝枠に付いている）
 *   演習問題 枠の肩に立つ、いちばん幅も高さもある札（朱）
 * 色数を最小にした案。色による即座の区別は弱くなるが、
 * 「色が分からなくても分かる」をいちばん強く満たす。
 * ============================================================ */
.v-i{--fu-rei:#2b261e;--fu-reidai:#2b261e;--fu-renshu:#2b261e;--fu-miss:#9c3b21;
     --fu-code:#453c30;--fu-out:#332d25;--fu-rail:#2b261e;--fu-lv0:#3f382e}
.v-i .blk,.v-i .mistake,.v-i .code,.v-i .out,.v-i .stdin,.v-i .rail__blk,.v-i .lv0{position:relative}

/* 例 ── 文中のいちばん小さい札。四隅とも丸い */
.v-i .t-rei{padding-left:20px;border-left:2px solid var(--rule)}
.v-i .t-rei .blk__tab{display:inline-block;background:var(--fu-rei);border-radius:4px;
  font-size:12.5px;padding:1px 11px;margin-bottom:10px}
/* 例題 ── 上の罫をまたぐ。四隅とも丸い、一回り大きい */
.v-i .t-reidai{border-top:2px solid var(--strong);border-bottom:1px solid var(--strong)}
.v-i .t-reidai .blk__tab{position:absolute;left:16px;top:0;transform:translateY(-50%);z-index:2;
  background:var(--fu-reidai);border-radius:4px;font-size:14px;padding:3px 16px}
.v-i .t-reidai .blk__in{padding:26px 16px 20px}
/* 練習問題 ── 枠の上辺に「立つ」。下の角は落とさない＝枠に付いている */
.v-i .t-renshu .blk__tab{position:absolute;left:-1.5px;bottom:100%;background:var(--fu-renshu);
  border-radius:5px 5px 0 0;font-size:15.5px;padding:5px 22px}
.v-i .t-renshu .blk__in{padding:20px 22px 22px}
/* 演習問題 ── 枠の肩。幅も高さもいちばん大きい。ここだけ朱 */
.v-i .t-enshu .blk__tab{position:absolute;left:-3px;bottom:100%;background:var(--fu-enshu);
  border-radius:5px 5px 0 0;font-size:17.5px;padding:9px 30px;letter-spacing:.2em}
.v-i .t-enshu .blk__in{padding:22px 24px 22px}
/* よくある間違い ── 朱。ただし札は右端に置き、左に揃った4段の並びから外す */
.v-i .mistake{margin:3em 0;border-top:3px double var(--fu-miss);border-bottom:3px double var(--fu-miss);
  padding:26px 0 20px}
.v-i .mistake__lab{position:absolute;right:0;top:0;transform:translateY(-50%);margin:0;
  background:var(--fu-miss);border-radius:4px;font-size:15px;padding:4px 18px}
/* コードと実行結果 ── 黒い面の上辺をまたぐ、明るめの墨の小札 */
.v-i .code,.v-i .stdin,.v-i .out{margin-top:24px}
.v-i .code__lab,.v-i .out__lab,.v-i .stdin__lab{position:absolute;left:14px;top:0;transform:translateY(-50%);
  z-index:2;border-radius:3px;font-size:12.5px;padding:2px 12px}
.v-i .code__lab,.v-i .stdin__lab{background:var(--fu-code)}
.v-i .out__lab{background:var(--fu-out)}
.v-i .out--err .out__lab{background:var(--fu-err)}
/* 右レール ── 墨の小札が枠の上辺に立つ */
.v-i .rail__blk{padding:0}
.v-i .rail__in{padding:22px 15px 15px}
.v-i .rail__lab{position:absolute;left:-1.5px;bottom:100%;margin:0;background:var(--fu-rail);
  border-radius:4px 4px 0 0;font-size:12.5px;padding:2px 12px;letter-spacing:.12em}
.v-i .rail__blk{margin-top:20px}
.v-i .rail__blk+.rail__blk{margin-top:34px}
/* レベル0の補足 */
.v-i .lv0__fu{display:inline-block;background:var(--fu-lv0);border-radius:4px;font-size:12.5px;
  padding:2px 11px;letter-spacing:.12em;margin-right:10px}

/* ============================================================
 * 下部: 4種類の見分けだけを比べる欄
 * ============================================================ */
#compare{background:#17171a;color:#e6e6ea;padding:44px 0 64px;border-top:3px solid #000}
#compare .cwrap{max-width:1200px;margin:0 auto;padding:0 24px}
#compare h2{margin:0;font-size:19px;letter-spacing:.06em}
#compare .cnote{margin:8px 0 26px;font-size:13px;color:#9c9ca4;line-height:1.8;max-width:840px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.cmp__head{margin:0 0 4px;font-size:14px;font-weight:700;letter-spacing:.06em}
.cmp__axis{margin:0 0 10px;font-size:12px;color:#9c9ca4;line-height:1.7}
.cmp__pane{padding:30px 20px 26px}
.cmp__pane .blk{margin:0 0 30px}
.cmp__pane .mistake{margin:36px 0 0}
.cmp__pane .blk__in p,.cmp__pane .mistake__in p{margin:0;font-size:15px;line-height:1.75}
.cmp__pane .blk__in pre{margin:0;font-family:"IBM Plex Mono",monospace;font-size:14px}
.v-g.cmp__pane .t-reidai,.v-g.cmp__pane .t-renshu,.v-g.cmp__pane .t-enshu{margin-top:34px}
.v-i.cmp__pane .t-reidai{margin-top:34px}
.v-i.cmp__pane .t-renshu,.v-i.cmp__pane .t-enshu{margin-top:42px}
.cmp__gray{filter:grayscale(1)}
#compare .cbtn{font-family:inherit;font-size:12px;padding:4px 12px;border-radius:5px;border:1px solid #46464e;
  background:#2a2a2c;color:#ddd;cursor:pointer;margin-bottom:18px}
#compare .cbtn[aria-pressed="true"]{background:#ececec;color:#111;border-color:#ececec;font-weight:700}
</style>
</head>
<body>

<header id="tool">
  <span class="t-name">レッスン画面ピッカー 第3回</span>
  <span class="t-tabs">
    <button type="button" data-v="g" aria-pressed="true">案G 小札</button>
    <button type="button" data-v="h" aria-pressed="false">案H 全幅の帯</button>
    <button type="button" data-v="i" aria-pressed="false">案I 墨で統一</button>
  </span>
  <span class="t-desc" id="tdesc"></span>
  <a class="t-jump" href="#compare">4種類の見分けだけを比べる ↓</a>
</header>

<div id="stage"></div>

<section id="compare">
  <div class="cwrap">
    <h2>4種類の見分けだけを比べる</h2>
    <p class="cnote">全体を見ずに、例 / 例題 / 練習問題 / 演習問題 の付き方だけを比べる欄です。上から下へ「軽い→重い」の順に並べ、最後によくある間違いを置いています。札がどれもすぐ見つかるか、文字を読まずに順序が分かるか、よくある間違いが4段の階段から外れて見えるかを見てください。下のボタンで色を抜くと、札の形と大きさ・枠の階段だけで順序が読めるかを確かめられます。</p>
    <button type="button" class="cbtn" id="cgray" aria-pressed="false">色を抜いて見る</button>
    <div class="cmp" id="cmp"></div>
  </div>
</section>

<script>
/* ------------------------------------------------------------
 * 中身は src/content/lessons/01-python/01-print.mdx のまま。
 * 3案で同じ文章・同じコード・同じ問題を出し、札の当て方だけを変える。
 * ---------------------------------------------------------- */
var esc = function (s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
};
var lines = function (arr) {
  return arr.map(function (l) { return '<span class="ln">' + (l === '' ? '&nbsp;' : esc(l)) + '</span>'; }).join('');
};
var code = function (label, arr, mod) {
  return '<div class="code code--num' + (mod ? ' ' + mod : '') + '">' +
    '<div class="code__lab">' + label + '</div><pre>' + lines(arr) + '</pre></div>';
};
var out = function (label, arr, mod) {
  return '<div class="out' + (mod ? ' ' + mod : '') + '">' +
    '<div class="out__lab">' + label + '</div><pre>' + lines(arr) + '</pre></div>';
};
var ed = function (label, val, rows) {
  var g = '';
  for (var i = 1; i <= rows; i++) { g += '<span>' + i + '</span>'; }
  return '<div class="code code--ed"><div class="code__lab">' + label + '</div>' +
    '<div class="ed-wrap"><div class="ed-gut">' + g + '</div>' +
    '<textarea class="ed" rows="' + rows + '" spellcheck="false">' + esc(val) + '</textarea></div></div>';
};
var stdin = function (val) {
  return '<div class="stdin"><label class="stdin__lab">入力</label>' +
    '<textarea class="sin" rows="2" spellcheck="false">' + esc(val) + '</textarea></div>' +
    '<p class="stdin__note">input() は、この欄を上から1行ずつ読みます。</p>';
};
var btn = function (t, mod) {
  return '<button type="button" class="btn' + (mod ? ' btn--' + mod : '') + '">' + t + '</button>';
};
var blk = function (type, kind, num, inner, foot) {
  return '<section class="blk t-' + type + '">' +
    '<p class="blk__tab">' + kind + ' ' + num + '</p>' +
    '<div class="blk__in">' + inner + '</div>' +
    (foot ? '<div class="blk__foot">' + foot + '</div>' : '') + '</section>';
};

/* ---- 4種類の中身（すべて 01-print.mdx の実物） ---- */
var REI = blk('rei', '例', '1',
  '<div class="bar bar--top">' + btn('▶ 実行') + '</div>' +
  code('コード例', ['print("Hello")', 'print(10 + 20)']) +
  out('実行結果', ['Hello', '30']));

var REIDAI = blk('reidai', '例題', '1',
  '<div class="prompt"><p>次のコードを入力して実行し、採点してください。</p></div>' +
  code('打つコード', ['print("Python")']) +
  ed('あなたのコード', '', 3) +
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + '</div>');

var RENSHU = blk('renshu', '練習問題', '1',
  '<div class="prompt"><p>上のコードを書き足して、1行目に <code>赤</code>、2行目に <code>青</code> と表示されるようにしてください。</p></div>' +
  ed('コード', 'print("赤")', 3) +
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + btn('最初の形に戻す', 'quiet') + '</div>');

var ENSHU = blk('enshu', '演習問題', '1',
  '<div class="prompt"><p>入力欄の1行を読み取り、その前後に <code>【</code> と <code>】</code> を付けて表示するプログラムを書いてください。入力欄の1行を読むには <code>input()</code> と書きます。<code>input()</code> の説明は次の節で行います。</p></div>' +
  '<p class="judge">判定に使う入力: <code>りんご</code>　<code>0</code>　<code>-5</code></p>' +
  ed('解答のコード', '', 5) +
  stdin('りんご'),
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + btn('最初の形に戻す', 'quiet') + '</div>');

var MISTAKE =
  '<aside class="mistake"><p class="mistake__lab">よくある間違い</p><div class="mistake__in">' +
  '<div class="bar bar--top">' + btn('▶ 実行') + '</div>' +
  code('壊れたコードの例', ['print(“Python”)'], 'code--broken') +
  out('出るエラー', ["SyntaxError: invalid character '“' (U+201C)"], 'out--err') +
  '<div class="mistake__fix"><p>全角のダブルクォートを使っています。<code>"</code> は半角で入力してください。日本語入力がオンになっていると全角になります。</p></div>' +
  '</div></aside>';

var LEVEL0 =
  '<details class="lv0" open><summary class="lv0__t"><span class="lv0__fu">操作の補足</span>半角のダブルクォートの入れ方</summary>' +
  '<div class="lv0__b"><p><code>Shift</code> を押しながら数字の <code>2</code> のキーを押すと <code>"</code> が入ります。' +
  '日本語入力がオンのときは <code>”</code> になります。<code>半角/全角</code> キーで日本語入力を切り替えてください。</p></div></details>';

var RAIL =
  '<aside class="rail">' +
  '<div class="rail__blk"><p class="rail__lab">この章の節</p><div class="rail__in"><ol>' +
  '<li class="is-now"><span class="rail__st">いま</span><a href="#">printで値を表示する</a></li>' +
  '<li><span class="rail__st">未</span><a href="#">inputで値を受け取る</a></li>' +
  '</ol></div></div>' +
  '<div class="rail__blk"><p class="rail__lab">用語集</p><div class="rail__in">' +
  '<a href="#">この教材で使う言葉</a></div></div>' +
  '<div class="rail__blk"><p class="rail__lab">先生に聞く</p><div class="rail__in">' +
  '<button type="button" class="rail__ask" disabled>準備中</button>' +
  '<p class="rail__note">ログインを作ったら使えるようになります。</p></div></div>' +
  '</aside>';

var SITE =
  '<header class="site"><div class="site__wrap">' +
  '<a class="site__name" href="#">KIT 機械学習プロジェクト</a>' +
  '<p class="site__full">AI・機械学習を全課程で0から学べるプロジェクト</p>' +
  '<nav class="site__links">' +
  '<a href="#">ホーム</a><a href="#">プロジェクトについて</a><a href="#">活動</a>' +
  '<a href="#" aria-current="page">学習</a><a href="#">成果・お知らせ</a>' +
  '</nav></div></header>';

function lessonHTML(v) {
  return '<section class="lesson vbase v-' + v + '"><div class="lesson__wrap">' +
    '<div class="ltop">' +
      '<p class="ltop__ch">第1章 Python を書きはじめる</p>' +
      '<h1 class="ltop__h1"><span class="sec">1.1</span>printで値を表示する</h1>' +
      '<p class="ltop__meta">この章の 1 / 2 節 ・ 目安 12 分</p>' +
    '</div>' +
    '<div class="lgrid"><article class="lbody">' +

      '<p>10と20を足す式を書いても、画面には何も出ません。計算の結果を画面に出す手立てがないと、合っているかを目で確かめられません。数が合わないときに、どこで違ったのかも分かりません。</p>' +

      '<p class="noind">次のコードの ▶ を押してください。</p>' +
      REI +

      '<p>1行目の <code>print</code> は、渡した値を画面に表示する関数です。かっこの中に書いた値を引数（ひきすう）と呼びます。1行目の引数は <code>"Hello"</code> です。</p>' +
      '<p><code>"</code> で囲んだものを文字列（string）と呼びます。囲みの <code>"</code> は画面に出ません。出るのは中の文字だけです。</p>' +
      '<p>2行目の引数は <code>10 + 20</code> です。かっこの中が先に計算され、結果の <code>30</code> が表示されます。<code>print</code> は1回呼ぶごとに1行を表示します。</p>' +
      '<p><code>print</code> を書かずに <code>10 + 20</code> とだけ書いた場合、計算は行われますが画面には何も出ません。表示するかどうかは、書いた人が <code>print</code> で指示します。</p>' +

      LEVEL0 +
      MISTAKE +
      REIDAI +
      RENSHU +
      ENSHU +

      '<p><code>print</code> で値を出せるようになりました。次の節では、こちらから値を渡す <code>input()</code> を扱います。</p>' +

      '<nav class="lnav"><span></span><a href="#">次の節へ　inputで値を受け取る →</a></nav>' +
    '</article>' + RAIL + '</div></div></section>';
}

var DESC = {
  g: '案G 小札 — 小さい角丸の札が枠の上辺をまたぐ。色は種類ごと（例＝灰 / 例題＝墨 / 練習問題＝藍 / 演習問題＝朱）。右レールもコードのキャプションも同じ小札。案Cに一番近い。',
  h: '案H 全幅の帯 — 札を枠の幅いっぱいの帯にして頭に置く。色は種類ごと、帯の高さでも重さを出す（例＝細い → 演習問題＝厚い）。雑誌の小見出しに近い、はっきりした見え方。',
  i: '案I 墨で統一 — 札の色はほぼ墨。朱は演習問題とよくある間違いだけ。種類の区別は札の形と大きさと位置（文中の小札 → 罫をまたぐ → 枠の上辺に立つ → 枠の肩に大きく立つ）。'
};

var stage = document.getElementById('stage');
stage.innerHTML = ['g', 'h', 'i'].map(function (v) {
  return '<div class="pane" id="pane-' + v + '"' + (v === 'g' ? '' : ' hidden') + '>' + SITE + lessonHTML(v) + '</div>';
}).join('');

var tabs = document.querySelectorAll('#tool button[data-v]');
var desc = document.getElementById('tdesc');
function show(v) {
  ['g', 'h', 'i'].forEach(function (k) { document.getElementById('pane-' + k).hidden = k !== v; });
  tabs.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
  desc.textContent = DESC[v];
  window.scrollTo(0, 0);
}
tabs.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.v); }); });
desc.textContent = DESC.g;

/* ---- 下部: 4種類＋よくある間違いの見分けだけ ---- */
var SHORT = [
  ['rei', '例', '1', '<pre>print("Hello")</pre>'],
  ['reidai', '例題', '1', '<p>次のコードを入力して実行し、採点してください。</p>'],
  ['renshu', '練習問題', '1', '<p>上のコードを書き足して、1行目に 赤、2行目に 青 と…</p>'],
  ['enshu', '演習問題', '1', '<p>入力欄の1行を読み取り、その前後に 【 と 】 を付けて…</p>']
];
var SHORT_MISS =
  '<aside class="mistake"><p class="mistake__lab">よくある間違い</p>' +
  '<div class="mistake__in"><p>全角のダブルクォートを使っています。半角で入力してください。</p></div></aside>';
var COLS = [
  ['g', '案G 小札', '札＝小さい角丸が上辺をまたぐ。色で種類、大きさで重さ（13 → 14 → 15 → 17.5px）。階段は左罫 → 上下罫 → 閉じた枠 → 二重の太枠。'],
  ['h', '案H 全幅の帯', '札＝枠の幅いっぱいの帯。色で種類、帯の厚みで重さ（上下3 → 6 → 9 → 13px）。階段は案Gと同じ。'],
  ['i', '案I 墨で統一', '札はほぼ墨、朱は演習問題とよくある間違いだけ。種類は札の形と位置で分ける（文中 → 罫をまたぐ → 上辺に立つ → 肩に大きく立つ）。']
];
document.getElementById('cmp').innerHTML = COLS.map(function (c) {
  return '<div class="cmp__col"><p class="cmp__head">' + c[1] + '</p><p class="cmp__axis">' + c[2] + '</p>' +
    '<div class="lesson vbase v-' + c[0] + ' cmp__pane">' +
    SHORT.map(function (s) { return blk(s[0], s[1], s[2], s[3]); }).join('') + SHORT_MISS +
    '</div></div>';
}).join('');

var cgray = document.getElementById('cgray');
cgray.addEventListener('click', function () {
  var on = cgray.getAttribute('aria-pressed') !== 'true';
  cgray.setAttribute('aria-pressed', String(on));
  document.getElementById('cmp').classList.toggle('cmp__gray', on);
  cgray.textContent = on ? '色を戻す' : '色を抜いて見る';
});
</script>
</body>
</html>
