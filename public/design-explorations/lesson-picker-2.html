<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レッスン画面ピッカー 第2回 — 案D / 案E / 案F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
 * レッスン画面ピッカー 第2回
 *
 * 前回の回答:
 *   「案Aの雰囲気をベースに、Bみたいにコードの部分は黒い背景、
 *     Cのように例題・練習・演習・よくある間違いをはっきり分ける」
 *
 * 3案が共通して守ること
 *   1. 案Aの雰囲気（明朝・罫線・紙・余白）を土台にする → .vbase
 *   2. コードは黒い面（コード例・エディタ・実行結果・入力欄すべて）
 *   3. 4種類＋よくある間違いをはっきり分ける
 *
 * 3案で変えるのは「はっきり分ける」やり方だけ
 *   案D 罫と帯だけ（影ゼロ・角0・朱と墨のみ）
 *   案E 面を持ち上げる（ベタ影の厚みで順序）
 *   案F 地色の濃さ（沈む段で順序）
 *
 * ・マストヘッドとナビは第1次トークンのまま共通
 * ・本文16px以上、コード14px以上
 * ・本文720px＋右レール240px、外枠1080px（実装と同一）
 * ============================================================ */

/* ---------- ツールの枠（案の一部ではない） ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0f0f11;font-family:"Noto Sans JP",sans-serif}
#tool{position:sticky;top:0;z-index:60;background:#1c1c1e;color:#e8e8e8;border-bottom:1px solid #34343a;
  padding:9px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#tool .t-name{font-size:13px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
#tool .t-tabs{display:flex;gap:6px}
#tool button{font-family:inherit;font-size:13px;padding:5px 14px;border-radius:5px;border:1px solid #46464e;
  background:#2a2a2c;color:#ddd;cursor:pointer}
#tool button:hover{border-color:#8f8f98}
#tool button[aria-pressed="true"]{background:#ececec;color:#111;border-color:#ececec;font-weight:700}
#tool .t-desc{font-size:12px;color:#9c9ca4;flex:1;min-width:260px;line-height:1.6}
#tool .t-jump{font-size:12px;color:#9c9ca4;text-decoration:underline;white-space:nowrap}

/* ---------- サイト共通のマストヘッド（tokens.css の値をそのまま） ---------- */
.site{background:#f2f1ee;color:#232323;font-family:"BIZ UDPGothic","Noto Sans JP",sans-serif;
  border-bottom:3px double #3a3a3a;padding-top:16.5px}
.site__wrap{max-width:960px;margin:0 auto;padding:0 24px}
.site__name{display:block;text-align:center;text-decoration:none;color:inherit;font-family:"Zen Old Mincho",serif;
  font-weight:700;font-size:24px;letter-spacing:.08em;line-height:1.4}
.site__full{margin:4.5px 0 0;text-align:center;font-size:11.5px;letter-spacing:.14em;color:#5a5650}
.site__links{display:flex;justify-content:center;flex-wrap:wrap;gap:19.5px;margin-top:10.5px;
  border-top:1px solid #3a3a3a;padding:7.5px 0}
.site__links a{text-decoration:none;color:inherit;font-size:13.6px;white-space:nowrap;padding-bottom:2px}
.site__links a[aria-current="page"]{border-bottom:4px solid #b3402a;font-weight:700}

/* ---------- レッスン領域の骨格（3案共通の寸法） ---------- */
.lesson{padding:48px 0 78px}
.lesson__wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.lgrid{display:grid;grid-template-columns:minmax(0,720px) 240px;gap:48px;align-items:start}
.lbody{max-width:720px;min-width:0}
.lesson .rail{position:sticky;top:70px}
.cmp__pane .rail{position:static}
.lbody p{margin:0 0 1.1em}
.blk{margin:1.9em 0}
.blk__tab{margin:0}
.prompt p:last-child{margin-bottom:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font-family:inherit;cursor:pointer}
.rail ol,.rail ul{list-style:none;margin:0;padding:0}
.rail a{color:inherit}

/* ============================================================
 * 黒い面（3案共通の中身。外側の扱いだけ案ごとに変える）
 * 純黒ではなく紙に寄せた温かい墨色にして、紙の上で浮きすぎないようにする。
 * ============================================================ */
:root{
  --k-bg:#17140f;      /* コードの面 */
  --k-bg2:#100e0a;     /* 実行結果の面（1段沈む） */
  --k-fg:#ece6d8;      /* コードの字 */
  --k-fg2:#d6cfbf;     /* 結果の字 */
  --k-err:#e9b39b;     /* エラーの字 */
  --k-dim:#968c7a;     /* 暗い面のラベル */
  --k-line:#3b352b;    /* 暗い面の中の仕切り */
  --k-gut:#6b6355;     /* 行番号 */
}
.code{background:var(--k-bg)}
.out{background:var(--k-bg2)}
.code pre,.out pre{margin:0;white-space:pre;overflow-x:auto;font-family:"IBM Plex Mono",monospace;
  font-size:15px;line-height:1.85;padding:13px 16px}
.code pre{color:var(--k-fg)}
.out pre{color:var(--k-fg2)}
.out--err pre{color:var(--k-err)}
.code__lab,.out__lab,.stdin__lab{font-family:"Zen Old Mincho",serif;font-size:13px;letter-spacing:.14em}
.ln{display:block}
.code--num pre{counter-reset:ln}
.code--num .ln{counter-increment:ln;padding-left:3.1em;position:relative}
.code--num .ln::before{content:counter(ln);position:absolute;left:0;width:2.1em;text-align:right;color:var(--k-gut)}
/* 書き換えるエディタ（行番号の溝つき） */
.ed-wrap{display:flex;align-items:stretch;background:var(--k-bg)}
.ed-gut{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:1.85;
  color:var(--k-gut);text-align:right;padding:13px 9px 13px 16px;user-select:none}
.ed-gut span{display:block}
textarea.ed{flex:1;min-width:0;display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:1.85;
  padding:13px 16px 13px 7px;border:0;outline:0;resize:vertical;background:transparent;color:var(--k-fg)}
textarea.sin{display:block;width:100%;font-family:"IBM Plex Mono",monospace;font-size:15px;line-height:1.85;
  padding:11px 16px;border:0;outline:0;resize:vertical;background:var(--k-bg2);color:var(--k-fg)}

/* ============================================================
 * .vbase ＝ 3案が共有する「案Aの雰囲気」
 * 明朝の見出し、罫線で作る構造、紙の落ち着き、余白。
 * ここを動かさないので、3案の違いは課題の分け方だけになる。
 * ============================================================ */
.vbase{--card:#fffdf7;--ink:#1f1c17;--ink2:#5d564a;--rule:#c2b8a4;--strong:#2b261e;--shu:#9c3b21;
  color:var(--ink);font-family:"Noto Serif JP",serif;font-size:17.5px;line-height:2.05}
.vbase code{font-family:"IBM Plex Mono",monospace;font-size:15px;background:#ece5d5;padding:0 4px}
.vbase .ltop{border-bottom:3px double var(--strong);padding-bottom:16px;margin-bottom:34px}
.vbase .ltop__ch{margin:0;font-family:"Zen Old Mincho",serif;font-size:14.5px;letter-spacing:.18em;color:var(--ink2)}
.vbase .ltop__h1{margin:12px 0 0;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:31px;
  line-height:1.55;letter-spacing:.03em}
.vbase .ltop__h1 .sec{color:var(--shu);margin-right:16px}
.vbase .ltop__meta{margin:12px 0 0;font-size:14.5px;color:var(--ink2);letter-spacing:.06em}
.vbase .lbody>p{text-indent:1em}
.vbase .lbody>p.noind{text-indent:0}
.vbase .blk__tab{font-family:"Zen Old Mincho",serif}
.vbase .stdin__note{margin:6px 0 0;font-size:13.5px;color:var(--ink2);text-indent:0}
.vbase .judge{font-size:15.5px;color:var(--ink2)}
.vbase .mistake__lab{font-family:"Zen Old Mincho",serif;font-weight:700}
.vbase .mistake__fix{margin-top:14px;font-size:16.5px}
.vbase .mistake__fix p{margin:0}
.vbase .lv0__t{cursor:pointer;font-family:"Zen Old Mincho",serif;font-size:14.5px;letter-spacing:.1em;
  color:var(--ink2);padding:9px 16px}
.vbase .lv0__b{padding:0 16px 13px;font-size:16.5px}
.vbase .lv0__b p{margin:0}
.vbase .lnav{display:flex;justify-content:space-between;gap:16px;margin-top:46px;
  border-top:1px solid var(--rule);padding-top:20px}
.vbase .lnav a{font-family:"Zen Old Mincho",serif;font-size:16px;color:inherit;text-decoration:none}
.vbase .rail{font-size:14px;line-height:1.8;color:var(--ink)}
.vbase .rail__lab{margin:0 0 10px;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:14.5px;letter-spacing:.14em}
.vbase .rail li{display:flex;gap:9px;margin-bottom:10px;align-items:baseline}
.vbase .rail__st{flex:0 0 auto;width:2.6em;text-align:center;font-family:"Zen Old Mincho",serif;font-size:12px;color:var(--ink2)}
.vbase .rail li.is-now .rail__st{color:var(--shu);font-weight:700}
.vbase .rail li.is-now a{font-weight:700}
.vbase .rail a{text-decoration:none}
.vbase .rail__note{margin:6px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.7}
.vbase .btn{font-family:"Zen Old Mincho",serif;font-size:15px;letter-spacing:.08em;padding:6px 18px;border-radius:0}
.vbase .bar{margin:14px 0 0}
.vbase .bar--top{margin:0 0 10px}

/* ============================================================
 * 案D ＝ 罫と帯だけで分ける
 *
 * 影ゼロ・角丸ゼロ。紙に印刷されたまま。
 * 4種類は「ラベル帯の形・位置・太さ」だけで分ける。
 *   例      帯なし（見出しの行に罫を1本引くだけ）
 *   例題    帯が上辺に乗る（罫の上に座る小さい帯）
 *   練習問題 帯が上辺に食い込む（閉じた枠を跨ぐ）
 *   演習問題 帯が全幅になり、上下から挟む（3px double の枠＋足元の帯）
 * よくある間違いは箱を持たない（左右に枠が無い段）ので、この階段に混ざらない。
 *
 * 黒い面の置き方 ＝ 図版として額装する。
 *   1px 墨の枠で閉じ、その内側の上に紙色のキャプション帯を置く。
 *   紙 → 罫 → 紙のキャプション → 黒 と段を踏むので、黒が直に紙へ触れない。
 * ============================================================ */
.v-d{--paper:#f6f2e9;--shu-wash:#efe1d9;background:var(--paper)}

.v-d .code,.v-d .out,.v-d .stdin{border:1px solid var(--strong);margin-top:12px}
.v-d .out{margin-top:10px}
.v-d .code__lab,.v-d .out__lab,.v-d .stdin__lab{display:block;background:var(--paper);color:var(--ink2);
  padding:5px 14px;border-bottom:1px solid var(--strong)}
.v-d .code--broken .code__lab,.v-d .out--err .out__lab{color:var(--shu)}
.v-d .btn{border:1px solid var(--strong);background:var(--card);color:var(--ink)}
.v-d .btn--strong{background:var(--strong);color:var(--card);font-weight:700}
.v-d .btn--quiet{border-style:dotted;color:var(--ink2)}

/* 4種類 ── 帯の形・位置・太さだけで段を作る */
.v-d .t-rei{margin:2em 0;padding-left:20px;border-left:2px solid var(--rule)}
.v-d .t-rei .blk__tab{font-size:15px;letter-spacing:.18em;color:var(--ink2);
  border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:6px}
.v-d .t-reidai{margin:2.4em 0}
.v-d .t-reidai .blk__tab{display:inline-block;background:var(--strong);color:var(--card);font-weight:700;
  font-size:14.5px;letter-spacing:.18em;padding:3px 16px}
.v-d .t-reidai .blk__in{border-top:1px solid var(--strong);border-bottom:1px solid var(--strong);padding:16px 0 20px}
.v-d .t-renshu{position:relative;margin:2.9em 0;border:1.5px solid var(--strong)}
.v-d .t-renshu .blk__tab{position:absolute;left:22px;bottom:100%;transform:translateY(50%);
  background:var(--strong);color:var(--card);font-weight:700;font-size:15.5px;letter-spacing:.18em;padding:4px 20px}
.v-d .t-renshu .blk__in{padding:26px 22px 22px}
.v-d .t-enshu{margin:3.2em 0;border:3px double var(--strong)}
.v-d .t-enshu .blk__tab{display:block;background:var(--shu);color:#fffdf7;font-weight:700;
  font-size:17.5px;letter-spacing:.26em;padding:10px 22px}
.v-d .t-enshu .blk__in{padding:20px 22px 22px}
.v-d .t-enshu .blk__foot{background:var(--shu-wash);border-top:1px solid var(--strong);padding:13px 22px}
.v-d .t-enshu .blk__foot .bar{margin:0}
.v-d .judge{margin:14px 0 0;border-top:1px dotted var(--rule);border-bottom:1px dotted var(--rule);padding:8px 0}

/* よくある間違い ── 箱にしない。上下を朱の二重罫で挟んだ段 */
.v-d .mistake{margin:2.8em 0;border-top:3px double var(--shu);border-bottom:3px double var(--shu);padding:16px 0 20px}
.v-d .mistake__lab{margin:0 0 12px;color:var(--shu);font-size:19px;letter-spacing:.12em}
.v-d .lv0{margin:2.2em 0;border:1px dashed var(--rule);background:#f1ece0}
.v-d .lnav a{border-bottom:1px solid var(--rule);padding-bottom:3px}
.v-d .rail__lab{border-bottom:1px solid var(--rule);padding-bottom:5px}
.v-d .rail__blk+.rail__blk{margin-top:30px}
.v-d .rail__ask{width:100%;border:1px dotted var(--rule);background:transparent;color:var(--ink2);
  padding:7px 10px;font-family:"Zen Old Mincho",serif;font-size:14px}

/* ============================================================
 * 案E ＝ 面を持ち上げて分ける
 *
 * 案Cのベタ影を案Aの紙に載せる。本文と見出しは案Aのまま。
 * 持ち上げるのは課題とよくある間違いだけ。重さの順は影の厚み。
 *   例      紙のまま（面を持たない）
 *   例題    白い面に置くだけ（1px 枠・影なし）
 *   練習問題 白い面＋1.5px 枠＋3px3px の影＋上辺から出るつまみ（藍）
 *   演習問題 白い面＋2.5px 枠＋6px6px の影＋全幅の帯（朱）
 * よくある間違いは持ち上がるが、影が逆向き（左下）で枠が朱の二重罫。
 * 同じ階段には乗らない。
 *
 * 黒い面の置き方 ＝ 面を左右いっぱいに断ち切る帯にする。
 *   紙や白い面の上に「黒い四角を置く」のをやめ、面を横切る切れ込みにした。
 *   四辺のうち左右が無くなるので、浮いた板に見えない。
 * ============================================================ */
.v-e{--paper:#f4f1e8;--card:#ffffff;--ai:#27506c;--shu-lift:#d6b3a6;--pad:22px;background:var(--paper)}

.v-e .code{margin:12px calc(-1 * var(--pad)) 0}
.v-e .out{margin:0 calc(-1 * var(--pad))}
.v-e .stdin{margin:0 calc(-1 * var(--pad))}
.v-e .code__lab,.v-e .out__lab,.v-e .stdin__lab{display:block;color:var(--k-dim);padding:6px var(--pad)}
.v-e .code__lab{border-bottom:1px solid var(--k-line)}
.v-e .out__lab,.v-e .stdin__lab{border-top:1px solid var(--k-line)}
.v-e .code pre,.v-e .out pre{padding:13px var(--pad)}
.v-e .out pre{padding-top:4px}
.v-e .ed-gut{padding-left:var(--pad)}
.v-e textarea.sin{padding:11px var(--pad)}
.v-e .code--broken .code__lab,.v-e .out--err .out__lab{color:#e2a98f}
.v-e .btn{border:1.5px solid var(--strong);background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--strong)}
.v-e .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--strong)}
.v-e .btn--strong{background:var(--shu);border-color:var(--strong);color:#fff;font-weight:700}
.v-e .btn--quiet{box-shadow:none;border-width:1px;border-style:dotted;color:var(--ink2)}

/* 4種類 ── 影の厚みで持ち上がる */
.v-e .t-rei{--pad:0;margin:2.1em 0}
.v-e .t-rei .blk__tab{font-size:15px;letter-spacing:.18em;color:var(--ink2);
  border-bottom:1px solid var(--rule);padding-bottom:5px;margin-bottom:2px}
.v-e .t-reidai{margin:2.5em 0;background:var(--card);border:1px solid var(--strong)}
.v-e .t-reidai .blk__tab{display:inline-block;margin:18px 0 0 var(--pad);border:1px solid var(--strong);
  background:var(--paper);font-weight:700;font-size:14px;letter-spacing:.16em;padding:2px 15px}
.v-e .t-reidai .blk__in{padding:12px var(--pad) 20px}
.v-e .t-renshu{position:relative;margin:3.2em 0;background:var(--card);border:1.5px solid var(--strong);
  box-shadow:3px 3px 0 var(--strong)}
.v-e .t-renshu .blk__tab{position:absolute;left:20px;bottom:100%;margin-bottom:-1.5px;background:var(--ai);color:#fff;
  border:1.5px solid var(--strong);border-bottom:0;font-weight:700;font-size:14.5px;letter-spacing:.16em;padding:3px 17px}
.v-e .t-renshu .blk__in{padding:20px var(--pad) 22px}
.v-e .t-enshu{margin:3.6em 0;background:var(--card);border:2.5px solid var(--strong);box-shadow:6px 6px 0 var(--strong)}
.v-e .t-enshu .blk__tab{display:block;background:var(--shu);color:#fff;border-bottom:2.5px solid var(--strong);
  font-weight:700;font-size:17px;letter-spacing:.24em;padding:10px var(--pad)}
.v-e .t-enshu .blk__in{padding:20px var(--pad) 22px}
.v-e .t-enshu .blk__foot{border-top:1px solid var(--rule);padding:14px var(--pad)}
.v-e .t-enshu .blk__foot .bar{margin:0}
.v-e .judge{margin:14px 0 0;border-top:1px dotted var(--rule);border-bottom:1px dotted var(--rule);padding:8px 0}

/* よくある間違い ── 逆向きに持ち上がる。朱の二重罫、ラベルは右 */
.v-e .mistake{--pad:22px;margin:3em 0;background:var(--card);border:3px double var(--shu);
  box-shadow:-4px 4px 0 var(--shu-lift)}
.v-e .mistake__lab{margin:0;text-align:right;color:var(--shu);font-size:17px;letter-spacing:.16em;
  padding:13px var(--pad) 0}
.v-e .mistake__in{padding:8px var(--pad) 20px}
.v-e .lv0{margin:2.2em 0;border:1px dashed var(--rule);background:var(--card)}
.v-e .lnav a{border:1.5px solid var(--strong);background:var(--card);box-shadow:3px 3px 0 var(--strong);padding:8px 17px}
.v-e .rail__blk{background:var(--card);border:1.5px solid var(--strong);box-shadow:3px 3px 0 var(--strong);padding:14px 15px}
.v-e .rail__blk+.rail__blk{margin-top:20px}
.v-e .rail__lab{border-bottom:1px solid var(--rule);padding-bottom:5px}
.v-e .rail__ask{width:100%;border:1px dotted var(--rule);background:var(--paper);color:var(--ink2);
  padding:7px 10px;font-family:"Zen Old Mincho",serif;font-size:14px}

/* ============================================================
 * 案F ＝ 地色の濃さで分ける
 *
 * 影も角丸も使わない。重さは面の地色の濃さと枠の太さだけ。
 *   例      紙のまま
 *   例題    わずかに沈む（1px 罫）
 *   練習問題 もう一段沈む（1.5px 墨罫）
 *   演習問題 最も濃い（2.5px 朱枠＋全幅の朱帯）
 * よくある間違いは階段と逆に「紙より明るい面」にし、枠を朱の二重罫にする。
 * 沈む階段の中に明るい面が1つだけ出るので、色を外しても別系統に見える。
 *
 * 黒い面の置き方 ＝ 紙色のマットを巻いて額装する。
 *   黒の外側に 5px の紙色の縁、その外に 1px の墨罫。
 *   地がどれだけ濃くなっても、黒と濃い地の間に必ず明るい縁が入るので濁らない。
 * ============================================================ */
.v-f{--paper:#f6f2e9;--lv1:#efe8d8;--lv2:#e5dbc4;--lv3:#dacdaf;background:var(--paper)}

.v-f .code,.v-f .out,.v-f .stdin{border:5px solid var(--card);outline:1px solid var(--strong);margin-top:14px}
.v-f .out{margin-top:12px}
.v-f .code__lab,.v-f .out__lab,.v-f .stdin__lab{display:block;color:var(--k-dim);padding:5px 14px;
  border-bottom:1px solid var(--k-line)}
.v-f .code--broken .code__lab,.v-f .out--err .out__lab{color:#e2a98f}
.v-f .btn{border:1px solid var(--strong);background:#fffdf7;color:var(--ink)}
.v-f .btn--strong{background:var(--strong);color:#fffdf7;font-weight:700}
.v-f .btn--quiet{border-style:dotted;color:var(--ink2)}

/* 4種類 ── 地色が一段ずつ沈み、枠が太くなる */
.v-f .t-rei{margin:2.1em 0;padding-left:20px;border-left:2px solid var(--rule)}
.v-f .t-rei .blk__tab{font-size:15px;letter-spacing:.18em;color:var(--ink2);margin-bottom:8px}
.v-f .t-reidai{margin:2.5em 0;background:var(--lv1);border:1px solid var(--rule)}
.v-f .t-reidai .blk__tab{display:block;font-weight:700;font-size:14.5px;letter-spacing:.18em;color:var(--ink2);
  padding:12px 22px 0}
.v-f .t-reidai .blk__in{padding:8px 22px 20px}
.v-f .t-renshu{margin:2.8em 0;background:var(--lv2);border:1.5px solid var(--strong)}
.v-f .t-renshu .blk__tab{display:block;font-weight:700;font-size:15.5px;letter-spacing:.18em;color:var(--strong);
  border-bottom:1px solid rgba(43,38,30,.28);padding:11px 22px}
.v-f .t-renshu .blk__in{padding:18px 22px 20px}
.v-f .t-enshu{margin:3.2em 0;background:var(--lv3);border:2.5px solid var(--shu)}
.v-f .t-enshu .blk__tab{display:block;background:var(--shu);color:#fffdf7;font-weight:700;font-size:17px;
  letter-spacing:.24em;padding:10px 22px}
.v-f .t-enshu .blk__in{padding:20px 22px 20px}
.v-f .t-enshu .blk__foot{border-top:1px solid rgba(43,38,30,.32);padding:14px 22px}
.v-f .t-enshu .blk__foot .bar{margin:0}
.v-f .judge{margin:14px 0 0;border-top:1px dotted rgba(43,38,30,.35);border-bottom:1px dotted rgba(43,38,30,.35);padding:8px 0}

/* よくある間違い ── 階段と逆に、紙より明るい面。枠は朱の二重罫 */
.v-f .mistake{margin:2.9em 0;background:#fffdf7;border:3px double var(--shu)}
.v-f .mistake__lab{margin:0;color:var(--shu);font-size:17.5px;letter-spacing:.16em;padding:14px 22px 0}
.v-f .mistake__in{padding:8px 22px 20px}
.v-f .lv0{margin:2.2em 0;border:1px dashed var(--rule);background:var(--lv1)}
.v-f .lnav a{border-bottom:1px solid var(--rule);padding-bottom:3px}
.v-f .rail__blk{background:var(--lv1);border:1px solid var(--rule);padding:14px 15px}
.v-f .rail__blk+.rail__blk{margin-top:18px}
.v-f .rail__lab{border-bottom:1px solid var(--rule);padding-bottom:5px}
.v-f .rail__ask{width:100%;border:1px dotted var(--rule);background:#fffdf7;color:var(--ink2);
  padding:7px 10px;font-family:"Zen Old Mincho",serif;font-size:14px}

/* ============================================================
 * 下部: 4種類の見分けだけを比べる欄
 * ============================================================ */
#compare{background:#17171a;color:#e6e6ea;padding:44px 0 64px;border-top:3px solid #000}
#compare .cwrap{max-width:1200px;margin:0 auto;padding:0 24px}
#compare h2{margin:0;font-size:19px;letter-spacing:.06em}
#compare .cnote{margin:8px 0 26px;font-size:13px;color:#9c9ca4;line-height:1.8;max-width:820px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.cmp__head{margin:0 0 4px;font-size:14px;font-weight:700;letter-spacing:.06em}
.cmp__axis{margin:0 0 10px;font-size:12px;color:#9c9ca4;line-height:1.7}
.cmp__pane{padding:26px 20px 26px}
.cmp__pane .blk{margin:0 0 26px}
.cmp__pane .mistake{margin:30px 0 0}
.cmp__pane .blk__in p,.cmp__pane .mistake__in p{margin:0;font-size:15px;line-height:1.75}
.cmp__pane .blk__in pre{margin:0;font-family:"IBM Plex Mono",monospace;font-size:14px}
.v-e.cmp__pane .t-renshu{margin-top:36px}
.v-e.cmp__pane,.v-f.cmp__pane{overflow:visible}
.cmp__gray{filter:grayscale(1)}
#compare .cbtn{font-family:inherit;font-size:12px;padding:4px 12px;border-radius:5px;border:1px solid #46464e;
  background:#2a2a2c;color:#ddd;cursor:pointer;margin-bottom:18px}
#compare .cbtn[aria-pressed="true"]{background:#ececec;color:#111;border-color:#ececec;font-weight:700}
</style>
</head>
<body>

<header id="tool">
  <span class="t-name">レッスン画面ピッカー 第2回</span>
  <span class="t-tabs">
    <button type="button" data-v="d" aria-pressed="true">案D 罫と帯</button>
    <button type="button" data-v="e" aria-pressed="false">案E 持ち上げ</button>
    <button type="button" data-v="f" aria-pressed="false">案F 濃さ</button>
  </span>
  <span class="t-desc" id="tdesc"></span>
  <a class="t-jump" href="#compare">4種類の見分けだけを比べる ↓</a>
</header>

<div id="stage"></div>

<section id="compare">
  <div class="cwrap">
    <h2>4種類の見分けだけを比べる</h2>
    <p class="cnote">全体を見ずに、例 / 例題 / 練習問題 / 演習問題 の付き方だけを比べる欄です。上から下へ「軽い→重い」の順に並べ、最後によくある間違いを置いています。文字を読まずに順序が分かるか、よくある間違いが4段の階段から外れて見えるかを見てください。下のボタンで色を抜くと、形・太さ・濃度だけで順序が読めるかを確かめられます。</p>
    <button type="button" class="cbtn" id="cgray" aria-pressed="false">色を抜いて見る</button>
    <div class="cmp" id="cmp"></div>
  </div>
</section>

<script>
/* ------------------------------------------------------------
 * 中身は src/content/lessons/01-python/01-print.mdx のまま。
 * 3案で同じ文章・同じコード・同じ問題を出し、分け方だけを変える。
 * ---------------------------------------------------------- */
var esc = function (s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
};
var lines = function (arr) {
  return arr.map(function (l) { return '<span class="ln">' + (l === '' ? '&nbsp;' : esc(l)) + '</span>'; }).join('');
};
var code = function (label, arr, mod) {
  return '<div class="code code--num' + (mod ? ' ' + mod : '') + '">' +
    '<div class="code__lab">' + label + '</div><pre>' + lines(arr) + '</pre></div>';
};
var out = function (label, arr, mod) {
  return '<div class="out' + (mod ? ' ' + mod : '') + '">' +
    '<div class="out__lab">' + label + '</div><pre>' + lines(arr) + '</pre></div>';
};
var ed = function (label, val, rows) {
  var g = '';
  for (var i = 1; i <= rows; i++) { g += '<span>' + i + '</span>'; }
  return '<div class="code code--ed"><div class="code__lab">' + label + '</div>' +
    '<div class="ed-wrap"><div class="ed-gut">' + g + '</div>' +
    '<textarea class="ed" rows="' + rows + '" spellcheck="false">' + esc(val) + '</textarea></div></div>';
};
var stdin = function (val) {
  return '<div class="stdin"><label class="stdin__lab">入力</label>' +
    '<textarea class="sin" rows="2" spellcheck="false">' + esc(val) + '</textarea></div>' +
    '<p class="stdin__note">input() は、この欄を上から1行ずつ読みます。</p>';
};
var btn = function (t, mod) {
  return '<button type="button" class="btn' + (mod ? ' btn--' + mod : '') + '">' + t + '</button>';
};
var blk = function (type, kind, num, inner, foot) {
  return '<section class="blk t-' + type + '">' +
    '<p class="blk__tab">' + kind + ' ' + num + '</p>' +
    '<div class="blk__in">' + inner + '</div>' +
    (foot ? '<div class="blk__foot">' + foot + '</div>' : '') + '</section>';
};

/* ---- 4種類の中身（すべて 01-print.mdx の実物） ---- */
var REI = blk('rei', '例', '1',
  '<div class="bar bar--top">' + btn('▶ 実行') + '</div>' +
  code('コード例', ['print("Hello")', 'print(10 + 20)']) +
  out('実行結果', ['Hello', '30']));

var REIDAI = blk('reidai', '例題', '1',
  '<div class="prompt"><p>次のコードを入力して実行し、採点してください。</p></div>' +
  code('打つコード', ['print("Python")']) +
  ed('あなたのコード', '', 3) +
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + '</div>');

var RENSHU = blk('renshu', '練習問題', '1',
  '<div class="prompt"><p>上のコードを書き足して、1行目に <code>赤</code>、2行目に <code>青</code> と表示されるようにしてください。</p></div>' +
  ed('コード', 'print("赤")', 3) +
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + btn('最初の形に戻す', 'quiet') + '</div>');

var ENSHU = blk('enshu', '演習問題', '1',
  '<div class="prompt"><p>入力欄の1行を読み取り、その前後に <code>【</code> と <code>】</code> を付けて表示するプログラムを書いてください。入力欄の1行を読むには <code>input()</code> と書きます。<code>input()</code> の説明は次の節で行います。</p></div>' +
  '<p class="judge">判定に使う入力: <code>りんご</code>　<code>0</code>　<code>-5</code></p>' +
  ed('解答のコード', '', 5) +
  stdin('りんご'),
  '<div class="bar">' + btn('採点する', 'strong') + btn('▶ 試す') + btn('最初の形に戻す', 'quiet') + '</div>');

var MISTAKE =
  '<aside class="mistake"><p class="mistake__lab">よくある間違い</p><div class="mistake__in">' +
  '<div class="bar bar--top">' + btn('▶ 実行') + '</div>' +
  code('壊れたコードの例', ['print(“Python”)'], 'code--broken') +
  out('出るエラー', ["SyntaxError: invalid character '“' (U+201C)"], 'out--err') +
  '<div class="mistake__fix"><p>全角のダブルクォートを使っています。<code>"</code> は半角で入力してください。日本語入力がオンになっていると全角になります。</p></div>' +
  '</div></aside>';

var LEVEL0 =
  '<details class="lv0" open><summary class="lv0__t">操作の補足: 半角のダブルクォートの入れ方</summary>' +
  '<div class="lv0__b"><p><code>Shift</code> を押しながら数字の <code>2</code> のキーを押すと <code>"</code> が入ります。' +
  '日本語入力がオンのときは <code>”</code> になります。<code>半角/全角</code> キーで日本語入力を切り替えてください。</p></div></details>';

var RAIL =
  '<aside class="rail">' +
  '<div class="rail__blk"><p class="rail__lab">この章の節</p><ol>' +
  '<li class="is-now"><span class="rail__st">いま</span><a href="#">printで値を表示する</a></li>' +
  '<li><span class="rail__st">未</span><a href="#">inputで値を受け取る</a></li>' +
  '</ol></div>' +
  '<div class="rail__blk"><p class="rail__lab">用語集</p><a href="#">この教材で使う言葉</a></div>' +
  '<div class="rail__blk"><p class="rail__lab">先生に聞く</p>' +
  '<button type="button" class="rail__ask" disabled>準備中</button>' +
  '<p class="rail__note">ログインを作ったら使えるようになります。</p></div>' +
  '</aside>';

var SITE =
  '<header class="site"><div class="site__wrap">' +
  '<a class="site__name" href="#">KIT 機械学習プロジェクト</a>' +
  '<p class="site__full">AI・機械学習を全課程で0から学べるプロジェクト</p>' +
  '<nav class="site__links">' +
  '<a href="#">ホーム</a><a href="#">プロジェクトについて</a><a href="#">活動</a>' +
  '<a href="#" aria-current="page">学習</a><a href="#">成果・お知らせ</a>' +
  '</nav></div></header>';

function lessonHTML(v) {
  return '<section class="lesson vbase v-' + v + '"><div class="lesson__wrap">' +
    '<div class="ltop">' +
      '<p class="ltop__ch">第1章 Python を書きはじめる</p>' +
      '<h1 class="ltop__h1"><span class="sec">1.1</span>printで値を表示する</h1>' +
      '<p class="ltop__meta">この章の 1 / 2 節 ・ 目安 12 分</p>' +
    '</div>' +
    '<div class="lgrid"><article class="lbody">' +

      '<p>10と20を足す式を書いても、画面には何も出ません。計算の結果を画面に出す手立てがないと、合っているかを目で確かめられません。数が合わないときに、どこで違ったのかも分かりません。</p>' +

      '<p class="noind">次のコードの ▶ を押してください。</p>' +
      REI +

      '<p>1行目の <code>print</code> は、渡した値を画面に表示する関数です。かっこの中に書いた値を引数（ひきすう）と呼びます。1行目の引数は <code>"Hello"</code> です。</p>' +
      '<p><code>"</code> で囲んだものを文字列（string）と呼びます。囲みの <code>"</code> は画面に出ません。出るのは中の文字だけです。</p>' +
      '<p>2行目の引数は <code>10 + 20</code> です。かっこの中が先に計算され、結果の <code>30</code> が表示されます。<code>print</code> は1回呼ぶごとに1行を表示します。</p>' +
      '<p><code>print</code> を書かずに <code>10 + 20</code> とだけ書いた場合、計算は行われますが画面には何も出ません。表示するかどうかは、書いた人が <code>print</code> で指示します。</p>' +

      LEVEL0 +
      MISTAKE +
      REIDAI +
      RENSHU +
      ENSHU +

      '<p><code>print</code> で値を出せるようになりました。次の節では、こちらから値を渡す <code>input()</code> を扱います。</p>' +

      '<nav class="lnav"><span></span><a href="#">次の節へ　inputで値を受け取る →</a></nav>' +
    '</article>' + RAIL + '</div></div></section>';
}

var DESC = {
  d: '案D 罫と帯だけ — 影ゼロ・角0。4種類はラベル帯の形と位置で分ける（帯なし → 上辺に乗る → 上辺に食い込む → 全幅で上下から挟む）。黒い面は1px墨の枠と紙色のキャプション帯で額装する。',
  e: '案E 面を持ち上げる — 重さの順は影の厚み（なし → 面だけ → 3px3px＋つまみ → 6px6px＋全幅の帯）。黒い面は面を左右いっぱいに断ち切る帯にして、浮いた板に見せない。',
  f: '案F 地色の濃さ — 影を使わず、面の地色が一段ずつ沈み枠が太くなる。黒い面には紙色の5pxマットを巻き、濃い地と黒が直に触れないようにする。'
};

var stage = document.getElementById('stage');
stage.innerHTML = ['d', 'e', 'f'].map(function (v) {
  return '<div class="pane" id="pane-' + v + '"' + (v === 'd' ? '' : ' hidden') + '>' + SITE + lessonHTML(v) + '</div>';
}).join('');

var tabs = document.querySelectorAll('#tool button[data-v]');
var desc = document.getElementById('tdesc');
function show(v) {
  ['d', 'e', 'f'].forEach(function (k) { document.getElementById('pane-' + k).hidden = k !== v; });
  tabs.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
  desc.textContent = DESC[v];
  window.scrollTo(0, 0);
}
tabs.forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.v); }); });
desc.textContent = DESC.d;

/* ---- 下部: 4種類＋よくある間違いの見分けだけ ---- */
var SHORT = [
  ['rei', '例', '1', '<pre>print("Hello")</pre>'],
  ['reidai', '例題', '1', '<p>次のコードを入力して実行し、採点してください。</p>'],
  ['renshu', '練習問題', '1', '<p>上のコードを書き足して、1行目に 赤、2行目に 青 と…</p>'],
  ['enshu', '演習問題', '1', '<p>入力欄の1行を読み取り、その前後に 【 と 】 を付けて…</p>']
];
var SHORT_MISS =
  '<aside class="mistake"><p class="mistake__lab">よくある間違い</p>' +
  '<div class="mistake__in"><p>全角のダブルクォートを使っています。半角で入力してください。</p></div></aside>';
var COLS = [
  ['d', '案D 罫と帯だけ', '帯の形と位置: 帯なし → 上辺に乗る → 上辺に食い込む → 全幅で上下から挟む。よくある間違いだけ箱を持たず、上下を朱の二重罫で挟む。'],
  ['e', '案E 面を持ち上げる', '影の厚み: なし → 面だけ → 3px3px＋つまみ → 6px6px＋全幅の帯。よくある間違いは影が逆向き（左下）で、階段に乗らない。'],
  ['f', '案F 地色の濃さ', '地色と枠の太さ: 紙のまま → わずかに沈む → もう一段 → 最も濃い＋朱枠。よくある間違いだけ紙より明るく、枠は朱の二重罫。']
];
document.getElementById('cmp').innerHTML = COLS.map(function (c) {
  return '<div class="cmp__col"><p class="cmp__head">' + c[1] + '</p><p class="cmp__axis">' + c[2] + '</p>' +
    '<div class="lesson vbase v-' + c[0] + ' cmp__pane">' +
    SHORT.map(function (s) { return blk(s[0], s[1], s[2], s[3]); }).join('') + SHORT_MISS +
    '</div></div>';
}).join('');

var cgray = document.getElementById('cgray');
cgray.addEventListener('click', function () {
  var on = cgray.getAttribute('aria-pressed') !== 'true';
  cgray.setAttribute('aria-pressed', String(on));
  document.getElementById('cmp').classList.toggle('cmp__gray', on);
  cgray.textContent = on ? '色を戻す' : '色を抜いて見る';
});
</script>
</body>
</html>
